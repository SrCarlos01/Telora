name: Desplegar a GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Permisos mínimos que exige actions/deploy-pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Un despliegue a la vez. Si llega un push nuevo mientras corre uno viejo,
# el viejo se cancela: nunca se publica un deploy más antiguo encima de uno nuevo.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # LISTA PERMITIDA: se publica SOLO lo que el sitio necesita, copiado a _site/.
      # Antes se subía el árbol completo (path: .) quitando solo tests.html, y así
      # quedaron públicos en telora.cl documentos internos (Documentos/*.docx,
      # Bases/*.docx, guia_prompts_claude_code_telora.md) — hallazgo del 27-09-2026.
      # Con lista permitida, cualquier archivo nuevo del repo queda privado por defecto.
      # La lista sale de lo que referencian index.html, sw.js (ASSETS), manifest.json,
      # tutorial.html y las páginas legales. Si se agrega un archivo que el sitio
      # necesita, hay que sumarlo aquí. cp falla si falta alguno: el deploy se detiene.
      # De icons/ se publican SOLO los íconos que usa el sitio (favicons, apple-touch,
      # PWA any/maskable) y og-image.png (vista previa al compartir). icon-1024, logo-*,
      # logo-maestro.svg y play-feature quedan en el repo: son para tiendas y marca.
      # (No hay CNAME: el dominio telora.cl está configurado en los ajustes de Pages.)
      - name: Armar _site con la lista permitida
        run: |
          set -euo pipefail
          mkdir -p _site/icons
          cp index.html sw.js manifest.json \
             xlsx.full.min.js supabase.min.js \
             tutorial.html privacidad.html terminos.html \
             _site/
          cp icons/favicon-16.png icons/favicon-32.png icons/apple-touch-icon.png \
             icons/icon-192.png icons/icon-512.png \
             icons/icon-maskable-192.png icons/icon-maskable-512.png \
             icons/og-image.png \
             _site/icons/
          echo "Contenido de _site:"
          ls -la _site _site/icons

      # Se estampa el sw.js que efectivamente se publica (el de _site/).
      - name: Estampar BUILD en sw.js
        run: |
          BUILD="${GITHUB_SHA::7}"
          if grep -q "__BUILD__" _site/sw.js; then
            sed -i "s/__BUILD__/${BUILD}/g" _site/sw.js
            echo "_site/sw.js estampado con BUILD=${BUILD}:"
            grep -n "const BUILD" _site/sw.js
          else
            echo "::warning::sw.js no tiene el marcador __BUILD__; se despliega sin estampar."
          fi

      - name: Configurar Pages
        uses: actions/configure-pages@v6

      - name: Subir artefacto del sitio
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Desplegar
        id: deployment
        uses: actions/deploy-pages@v5
