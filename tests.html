<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Telora · Tests del motor financiero</title>
<style>
  body{ font-family: system-ui, sans-serif; max-width: 760px; margin: 32px auto; padding: 0 16px; }
  h1{ font-size: 20px; }
  .caso{ padding: 10px 12px; border-radius: 8px; margin: 8px 0; border: 1px solid #ddd; }
  .ok{ background:#e8f7ee; border-color:#a7dfc0; }
  .fail{ background:#fdeaea; border-color:#f0b8b8; }
  .label{ font-weight:600; }
  .detalle{ font-size: 13px; color:#444; margin-top:4px; white-space:pre-wrap; }
  #resumen{ font-size:16px; font-weight:700; margin-top:20px; padding:12px; border-radius:8px; }
  #resumen.ok{ background:#e8f7ee; }
  #resumen.fail{ background:#fdeaea; }
  #localStorageCheck{ margin-top:24px; font-size:13px; color:#666; }
</style>
</head>
<body>
<h1>Telora · Harness de pruebas del motor financiero (T4, diagnóstico)</h1>
<p>Carga <code>index.html</code> completo en un iframe oculto, sustituye <code>state</code> por fixtures de prueba y llama a las funciones del motor directamente. No usa ningún framework de testing.</p>
<div id="resultados">Cargando iframe…</div>
<div id="resumen"></div>
<div id="localStorageCheck"></div>

<iframe id="appFrame" src="index.html" style="display:none"></iframe>

<script>
const resultados = [];
function assert(condition, label, detalle){
  resultados.push({ ok: !!condition, label, detalle: detalle || '' });
}

function renderResultados(){
  const cont = document.getElementById('resultados');
  cont.innerHTML = '';
  resultados.forEach(r=>{
    const div = document.createElement('div');
    div.className = 'caso ' + (r.ok ? 'ok' : 'fail');
    div.innerHTML = `<div class="label">${r.ok ? '✅ PASÓ' : '❌ FALLÓ'} — ${r.label}</div>` +
      (r.detalle ? `<div class="detalle">${r.detalle}</div>` : '');
    cont.appendChild(div);
  });
  const resumen = document.getElementById('resumen');
  const total = resultados.length;
  const pasaron = resultados.filter(r=>r.ok).length;
  resumen.textContent = `${pasaron}/${total} pruebas pasaron`;
  resumen.className = pasaron === total ? 'ok' : 'fail';
}

// Fixture mínimo de state: misma forma que produce loadState() (config con DEFAULTS +
// migrarEstadoCuentas agrega accounts/transfers/cuentaActiva). Se arma a mano acá para no
// depender de localStorage.
function fixtureBase(){
  return {
    config: {
      categorias: ["Comida","Arriendo/Vivienda","Cuentas y Servicios","Transporte","Salud","Cuidado personal","Vestimenta","Entretenimiento","Regalos","Ahorro","Varios"],
      metodos: ["Efectivo","Débito","Crédito","Transferencia"],
      fuentes: ["Sueldo","Trabajos extra","Ventas","Bono","Mesada","Interés","Otros"],
      categoriaIconos: {},
      categoriaTopes: {},
      onboardingVisto: true,
      cuentaActiva: 'total'
    },
    expenses: [],
    incomes: [],
    debts: [],
    goals: [],
    accounts: [{ id:'acc1', nombre:'Principal', orden:0, archivada:false }],
    transfers: []
  };
}

function resetCaches(win){
  win.resetMoneyCache();
  win.resetSaldoRowCache();
}

// HALLAZGO CLAVE (T4 Parte 1): `let state = loadState();` en index.html es una
// declaración de nivel superior de un <script> clásico (no módulo). En el navegador,
// un `let`/`const` global NO se convierte en propiedad de `window` (a diferencia de
// `var` o de las funciones, que sí quedan colgadas de `window`). Por eso
// `iframe.contentWindow.state = fixture` NO funciona como mecanismo de inyección: solo
// crea una propiedad `state` nueva y aislada sobre el objeto `window`, sin ningún efecto
// sobre el binding léxico `state` que leen las funciones del motor (se comprobó: con esa
// vía, disponibleDelMes/cuotasPendientesDelMes/proyeccionFinDeMes seguían leyendo el
// `state` real cargado al inicio — típicamente vacío o con datos de localStorage viejos
// — y daban resultados en 0 o desalineados con el fixture).
// Mecanismo que sí funciona: `iframe.contentWindow.eval(...)`. Un eval indirecto corre
// como código global DENTRO del realm del iframe, compartiendo el mismo entorno global
// léxico que el script de index.html — así que una asignación `state = {...}` dentro de
// ese eval SÍ reasigna el binding real que usan disponibleDelMes() y compañía.
function setState(win, fixture){
  win.eval('state = ' + JSON.stringify(fixture) + ';');
}

// monthKey de index.html es `const` de nivel superior (no `function`): por el mismo
// motivo que `state`, NO queda expuesto como `window.monthKey` dentro del iframe
// (verificado: typeof iframe.contentWindow.monthKey === 'undefined'). Se replica acá
// la misma fórmula (index.html: `const monthKey = d => d.getFullYear()*12+d.getMonth();`)
// para construir manualPaidMonthKeys en los fixtures, en vez de depender de una llamada
// al iframe que no existe.
function mk(d){ return d.getFullYear()*12 + d.getMonth(); }

async function runTests(){
  const iframe = document.getElementById('appFrame');
  const win = iframe.contentWindow;

  // Punto 1: confirmar que el iframe cargó y las funciones del motor existen.
  const funcionesEsperadas = [
    'disponibleDelMes','cuotasPendientesDelMes','aporteAutomaticoAcumulado','proyeccionFinDeMes',
    'resetMoneyCache','resetSaldoRowCache',
    'disponibleBaseDelMes','totalAportesMetasDelMes','saldoAcumuladoHasta',
    'cuotaVencidaPorFecha','cuotaPagadaDelMes','cuotaEstadoMes','cuotasSinConfirmarDelMes',
    'aporteMetaEnMes','aportePactadoDeMeta','calcularEstadoAportesDelMes',
    'cuotaInfoForMonth','desgloseDisponible','cuotasPorCategoriaGastoDelMes','aporteMetaObjetivoEnMes'
  ];
  funcionesEsperadas.forEach(nombre=>{
    assert(typeof win[nombre] === 'function', `iframe.contentWindow.${nombre} existe y es function`,
      `typeof = ${typeof win[nombre]}`);
  });

  // ---- Caso 1: disponibleDelMes ----
  // Mes sin arrastre previo (único mes con datos): ingreso 200000 - gasto 50000 = 150000.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i1', date:'2026-03-05', amount:200000, tipo:'Casual' });
    st.expenses.push({ id:'e1', date:'2026-03-10', amount:50000, tipo:'Casual', category:'Comida' });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 2, 15); // 15 marzo 2026
    const resultado = win.disponibleDelMes(refDate, 'total');
    const esperado = 150000;
    assert(resultado === esperado, `disponibleDelMes: ingreso 200.000 - gasto 50.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 2: cuotasPendientesDelMes ----
  // Deuda comprada 2026-02-01 en 3 cuotas de 300000/3=100000 c/u. En marzo (cuota 1 de 3)
  // debe aparecer como pendiente (no confirmada manualmente).
  {
    const st = fixtureBase();
    st.debts.push({
      id:'d1', purchaseDate:'2026-02-01', numCuotas:3, totalAmount:300000,
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: []
    });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 2, 15); // marzo 2026 = cuota 1 de la deuda
    const resultado = win.cuotasPendientesDelMes(refDate, 'total');
    const esperado = 100000;
    assert(resultado === esperado, `cuotasPendientesDelMes: cuota 1/3 de 300.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 3: aporteAutomaticoAcumulado ----
  // Meta con aporte automático de $20.000/mes activado en enero 2026. Hasta abril 2026
  // (inclusive) generó ocurrencias en feb, mar, abr = 3 meses * 20000 = 60000.
  {
    const st = fixtureBase();
    const goal = {
      id:'g1', nombre:'Meta test', indefinida:false, aportes:[], goalEndMonthKey:null,
      aporteAutomatico: {
        activo:true, pausado:false, tipo:'monto', valor:0, monto:20000,
        diaDelMes:1, fechaActivacion:'2026-01-01'
      }
    };
    st.goals.push(goal);
    setState(win, st);
    resetCaches(win);
    const hastaDate = new Date(2026, 3, 15); // 15 abril 2026
    const resultado = win.aporteAutomaticoAcumulado(goal, hastaDate);
    const esperado = 60000;
    assert(resultado === esperado, `aporteAutomaticoAcumulado: 3 meses (feb, mar, abr) * 20.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 4: proyeccionFinDeMes ----
  // Mes YA CERRADO (enero 2026, anterior al mes real de hoy) con un solo ingreso y un
  // solo gasto: la proyección de un mes cerrado no estima nada (dispRestantes=0), así
  // que dispProyectado debe coincidir con el resultado real del mes: 100.000 - 40.000 = 60.000.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i2', date:'2026-01-05', amount:100000, tipo:'Casual' });
    st.expenses.push({ id:'e2', date:'2026-01-10', amount:40000, tipo:'Casual', category:'Comida' });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 0, 15); // 15 enero 2026 (mes cerrado respecto a hoy)
    const resultado = win.proyeccionFinDeMes(refDate, 'total');
    const esperado = 60000;
    assert(resultado && resultado.dispProyectado === esperado,
      `proyeccionFinDeMes (mes cerrado): dispProyectado = ingreso 100.000 - gasto 40.000 = ${esperado}`,
      `Resultado obtenido: ${JSON.stringify(resultado)}`);
  }

  // ==================== T4 PARTE 2 — FRENTE A: más casos por función ====================

  // ---- Caso 1b: disponibleDelMes (normal, datos distintos + una cuota activa) ----
  // Junio 2026: ingreso 300.000 - gasto 80.000 - cuota 50.000 (deuda comprada en mayo,
  // 2 cuotas de 50.000) = 170.000. La fecha de compra (mayo) no genera movimiento propio
  // en mayo (su primera cuota es en junio), así que el arrastre de mayo sigue en 0.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i3', date:'2026-06-05', amount:300000, tipo:'Casual' });
    st.expenses.push({ id:'e3', date:'2026-06-20', amount:80000, tipo:'Casual', category:'Comida' });
    st.debts.push({
      id:'d2', purchaseDate:'2026-05-01', numCuotas:2, totalAmount:100000,
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: []
    });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 5, 15); // 15 junio 2026
    const resultado = win.disponibleDelMes(refDate, 'total');
    const esperado = 170000;
    assert(resultado === esperado, `disponibleDelMes (caso normal 2): 300.000 - 80.000 - cuota 50.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 1c: disponibleDelMes (límite: mes sin ningún movimiento) ----
  // state completamente vacío: sin arrastre, sin flujo, sin metas -> 0.
  {
    const st = fixtureBase();
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 6, 15); // julio 2026, sin datos en ningún lado
    const resultado = win.disponibleDelMes(refDate, 'total');
    const esperado = 0;
    assert(resultado === esperado, `disponibleDelMes (límite: mes sin movimientos) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 2b: cuotasPendientesDelMes (normal: dos deudas, una ya confirmada pagada) ----
  // Julio 2026: Deuda X (comprada junio, 4 cuotas de 100.000) tiene su cuota 1 en julio,
  // sin confirmar -> cuenta. Deuda Y (comprada mayo, 3 cuotas de 100.000) tiene su cuota 2
  // en julio, PERO confirmada como pagada (manualPaidMonthKeys) -> no cuenta. Total: 100.000.
  {
    const st = fixtureBase();
    const refDate = new Date(2026, 6, 15); // 15 julio 2026
    st.debts.push({
      id:'dX', purchaseDate:'2026-06-01', numCuotas:4, totalAmount:400000,
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: []
    });
    st.debts.push({
      id:'dY', purchaseDate:'2026-05-01', numCuotas:3, totalAmount:300000,
      manualPaidMonthKeys: [ mk(refDate) ], manualUnpaidMonthKeys: []
    });
    setState(win, st);
    resetCaches(win);
    const resultado = win.cuotasPendientesDelMes(refDate, 'total');
    const esperado = 100000;
    assert(resultado === esperado, `cuotasPendientesDelMes (normal 2: una pagada, una no) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 2c: cuotasPendientesDelMes (límite: cambio de año) ----
  // Deuda comprada 2025-12-01 en 1 cuota: su única cuota cae en enero 2026 (cruce de año
  // en addMonths). No confirmada -> pendiente por el total: 90.000.
  {
    const st = fixtureBase();
    st.debts.push({
      id:'dAnio', purchaseDate:'2025-12-01', numCuotas:1, totalAmount:90000,
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: []
    });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 0, 15); // 15 enero 2026
    const resultado = win.cuotasPendientesDelMes(refDate, 'total');
    const esperado = 90000;
    assert(resultado === esperado, `cuotasPendientesDelMes (límite: cambio de año, dic->ene) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 3b: aporteAutomaticoAcumulado (normal, datos distintos) ----
  // Activado 2026-03-01, $15.000/mes, hasta agosto 2026: ocurrencias en abr, may, jun,
  // jul, ago = 5 meses * 15.000 = 75.000.
  {
    const st = fixtureBase();
    const goal = {
      id:'gB', nombre:'Meta test B', indefinida:false, aportes:[], goalEndMonthKey:null,
      aporteAutomatico: {
        activo:true, pausado:false, tipo:'monto', valor:0, monto:15000,
        diaDelMes:15, fechaActivacion:'2026-03-01'
      }
    };
    st.goals.push(goal);
    setState(win, st);
    resetCaches(win);
    const hastaDate = new Date(2026, 7, 20); // 20 agosto 2026
    const resultado = win.aporteAutomaticoAcumulado(goal, hastaDate);
    const esperado = 75000;
    assert(resultado === esperado, `aporteAutomaticoAcumulado (normal 2): 5 meses (abr-ago) * 15.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 3c: aporteAutomaticoAcumulado (límite: hastaDate en el mismo mes de activación) ----
  // Activado 2026-05-01; hastaDate = 15 de mayo 2026 (mismo mes). El aporte automático solo
  // genera ocurrencias en meses POSTERIORES al de activación, así que todavía no hay
  // ninguna: acumulado = 0.
  {
    const st = fixtureBase();
    const goal = {
      id:'gC', nombre:'Meta test C', indefinida:false, aportes:[], goalEndMonthKey:null,
      aporteAutomatico: {
        activo:true, pausado:false, tipo:'monto', valor:0, monto:10000,
        diaDelMes:1, fechaActivacion:'2026-05-01'
      }
    };
    st.goals.push(goal);
    setState(win, st);
    resetCaches(win);
    const hastaDate = new Date(2026, 4, 20); // 20 mayo 2026, mismo mes que la activación
    const resultado = win.aporteAutomaticoAcumulado(goal, hastaDate);
    const esperado = 0;
    assert(resultado === esperado, `aporteAutomaticoAcumulado (límite: mismo mes de activación) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Caso 4b: proyeccionFinDeMes (normal: mes FUTURO) ----
  // Diciembre 2026 (futuro respecto a hoy): ningún gasto/ingreso "ya ocurrió" (mkRef >
  // mkHoy siempre da yaOcurrio=false), así que el gasto conocido pasa entero a
  // fijosCuotasRestantes y el estimado variable es 0 (cero días transcurridos).
  // dispProyectado = 0 (arrastre) + 200.000 (ingreso) - 30.000 (gasto conocido) = 170.000.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i4', date:'2026-12-05', amount:200000, tipo:'Casual' });
    st.expenses.push({ id:'e4', date:'2026-12-10', amount:30000, tipo:'Casual', category:'Comida' });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 11, 15); // 15 diciembre 2026 (mes futuro)
    const resultado = win.proyeccionFinDeMes(refDate, 'total');
    const esperado = 170000;
    assert(resultado && resultado.dispProyectado === esperado && resultado.diasTranscurridos === 0,
      `proyeccionFinDeMes (normal: mes futuro) dispProyectado = ${esperado}`,
      `Resultado obtenido: ${JSON.stringify(resultado)}`);
  }

  // ---- Caso 4c: proyeccionFinDeMes (límite: mes cerrado sin ningún movimiento) ----
  // state completamente vacío en un mes ya cerrado: sin ingresos (y sin ningún mes previo
  // del que estimar uno), sin gastos, sin cuotas, sin metas -> todo en 0.
  {
    const st = fixtureBase();
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 1, 15); // 15 febrero 2026, sin datos en ningún lado
    const resultado = win.proyeccionFinDeMes(refDate, 'total');
    const esperado = 0;
    assert(resultado && resultado.dispProyectado === esperado && resultado.proyGastos === 0 && resultado.ingresosProy === 0,
      `proyeccionFinDeMes (límite: mes cerrado sin movimientos) dispProyectado = ${esperado}`,
      `Resultado obtenido: ${JSON.stringify(resultado)}`);
  }

  // ==================== T4 PARTE 2 — FRENTE B: funciones nuevas ====================

  // ---- disponibleBaseDelMes ----
  // Abril 2026: ingreso 120.000 - gasto 20.000, sin cuotas ni arrastre = 100.000
  // (disponibleBaseDelMes NO resta metas, a diferencia de disponibleDelMes).
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i5', date:'2026-04-03', amount:120000, tipo:'Casual' });
    st.expenses.push({ id:'e5', date:'2026-04-25', amount:20000, tipo:'Casual', category:'Comida' });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 3, 15); // 15 abril 2026
    const resultado = win.disponibleBaseDelMes(refDate, 'total');
    const esperado = 100000;
    assert(resultado === esperado, `disponibleBaseDelMes: 120.000 - 20.000 (sin metas) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- totalAportesMetasDelMes ----
  // Mayo 2026: meta con un aporte manual de 5.000 registrado en mayo + un aporte
  // automático de 8.000/mes activado en abril (mayo es el primer mes posterior, así que
  // sí genera ocurrencia) y sin quedar pausado (el ingreso de mayo alcanza de sobra).
  // Total: 5.000 + 8.000 = 13.000.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i6', date:'2026-05-03', amount:50000, tipo:'Casual' });
    st.goals.push({
      id:'gD', nombre:'Meta test D', indefinida:false, goalEndMonthKey:null,
      aportes: [ { id:'apM1', fecha:'2026-05-10', monto:5000, tipo:'manual' } ],
      aporteAutomatico: {
        activo:true, pausado:false, tipo:'monto', valor:0, monto:8000,
        diaDelMes:1, fechaActivacion:'2026-04-01'
      }
    });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 4, 15); // 15 mayo 2026
    const resultado = win.totalAportesMetasDelMes(refDate, 'total');
    const esperado = 13000;
    assert(resultado === esperado, `totalAportesMetasDelMes: manual 5.000 + automático 8.000 = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- saldoAcumuladoHasta ----
  // Enero 2026: ingreso 100.000 - gasto 30.000 = arrastre +70.000. Febrero 2026: ingreso
  // 50.000 - gasto 20.000 = arrastre +30.000. Sin datos en marzo: saldoAcumuladoHasta(marzo)
  // debe sumar los dos meses anteriores = 70.000 + 30.000 = 100.000.
  {
    const st = fixtureBase();
    st.incomes.push({ id:'i7', date:'2026-01-05', amount:100000, tipo:'Casual' });
    st.expenses.push({ id:'e7', date:'2026-01-20', amount:30000, tipo:'Casual', category:'Comida' });
    st.incomes.push({ id:'i8', date:'2026-02-05', amount:50000, tipo:'Casual' });
    st.expenses.push({ id:'e8', date:'2026-02-20', amount:20000, tipo:'Casual', category:'Comida' });
    setState(win, st);
    resetCaches(win);
    const refDate = new Date(2026, 2, 15); // 15 marzo 2026 (sin datos propios)
    const resultado = win.saldoAcumuladoHasta(refDate, 'total');
    const esperado = 100000;
    assert(resultado === esperado, `saldoAcumuladoHasta: arrastre de enero (+70.000) y febrero (+30.000) = ${esperado}`,
      `Resultado obtenido: ${resultado}`);
  }

  // ---- Clúster cuotas: cuotaVencidaPorFecha / cuotaPagadaDelMes / cuotaEstadoMes /
  //      cuotasSinConfirmarDelMes ----
  // PRIORIDAD ALTA (T4): esta es exactamente el área del bug histórico de criterio
  // "vencida"/"pagada" invertido. Dos deudas construidas a propósito para contrastar:
  //   · Deuda "vencida sin confirmar": comprada 2025-12-01 (1 cuota/mes, 6 cuotas), su
  //     cuota 1 vence el 2026-01-01 -> en enero 2026 (mes cerrado hace mucho respecto a
  //     hoy) el día de vencimiento YA PASÓ y nadie la confirmó como pagada.
  //   · Deuda "pagada antes de vencer": comprada 2026-11-01 (3 cuotas), su cuota 1 vence
  //     el 2026-12-01 -> en diciembre 2026 (mes FUTURO respecto a hoy) el día de
  //     vencimiento AÚN NO llega, pero se confirma manualmente como pagada de todos modos
  //     (alguien pagó por adelantado).
  // El criterio correcto (post Tanda P, revertido el bug de Tanda I/J) es: SOLO la
  // confirmación manual decide "pagada". Vencida-sin-confirmar debe seguir en "activas"
  // (con aviso porConfirmar), y pagada-antes-de-vencer debe contar como "pagada" igual.
  {
    const refVencida = new Date(2026, 0, 15);   // 15 enero 2026
    const refPagada = new Date(2026, 11, 15);   // 15 diciembre 2026

    const debtVencida = {
      id:'dVenc', purchaseDate:'2025-12-01', numCuotas:6, totalAmount:600000,
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: []
    };
    const debtPagadaAntes = {
      id:'dPagAntes', purchaseDate:'2026-11-01', numCuotas:3, totalAmount:300000,
      manualPaidMonthKeys: [ mk(refPagada) ], manualUnpaidMonthKeys: []
    };

    const st = fixtureBase();
    st.debts.push(debtVencida, debtPagadaAntes);
    setState(win, st);
    resetCaches(win);

    // cuotaVencidaPorFecha: true para la vencida sin confirmar, false para la que aún no
    // llega a su fecha de vencimiento (independiente de que esté pagada o no).

  // ==================== DÍA 18 — Ida y vuelta filaX -> nube -> localX ====================
  // Para cada par (filaCuenta/localCuenta, ..., filaConfigCompartida/localConfigCompartida)
  // se arma un registro con la forma que tiene en `state` (la que deja migrateBackup), se
  // pasa por filaX, se simula el viaje a PostgREST y se vuelve con localX. El resultado
  // debe ser IGUAL al original clave por clave, incluido el tipo, y distinguiendo una clave
  // ausente de una presente con null/undefined. Un assert por registro.
  // Lo que NO cubre: conversiones del propio Postgres (numeric/bigint como string, formato
  // de date, orden de claves en jsonb). Solo prueba que filaX y localX son inversos.
  {
    const USER = 'user-test-ida-vuelta';

    // Simula el viaje a PostgREST: la fila se serializa (JSON.stringify descarta las claves
    // con undefined), el servidor devuelve null en toda columna que no recibió valor y
    // agrega updated_at.
    const viajeNube = fila => {
      const r = JSON.parse(JSON.stringify(fila));
      Object.keys(fila).forEach(k => { if(!(k in r)) r[k] = null; });
      r.updated_at = new Date().toISOString();
      return r;
    };

    const tipoDe = v => v === null ? 'null' : Array.isArray(v) ? 'array' : typeof v;
    // Lista legible de diferencias entre original y vuelta (vacía = iguales).
    const diferencias = (a, b, ruta) => {
      const out = [];
      const ta = tipoDe(a), tb = tipoDe(b);
      if(ta !== tb){ out.push(`${ruta}: tipo ${ta} (${JSON.stringify(a)}) -> ${tb} (${JSON.stringify(b)})`); return out; }
      if(ta === 'array'){
        if(a.length !== b.length) out.push(`${ruta}: largo ${a.length} -> ${b.length}`);
        for(let i = 0; i < Math.min(a.length, b.length); i++) out.push(...diferencias(a[i], b[i], `${ruta}[${i}]`));
        return out;
      }
      if(ta === 'object'){
        const claves = new Set([...Object.keys(a), ...Object.keys(b)]);
        claves.forEach(k => {
          const enA = Object.prototype.hasOwnProperty.call(a, k), enB = Object.prototype.hasOwnProperty.call(b, k);
          if(enA && !enB) out.push(`${ruta}.${k}: presente (${tipoDe(a[k])} ${JSON.stringify(a[k])}) -> AUSENTE`);
          else if(!enA && enB) out.push(`${ruta}.${k}: AUSENTE -> presente (${tipoDe(b[k])} ${JSON.stringify(b[k])})`);
          else out.push(...diferencias(a[k], b[k], `${ruta}.${k}`));
        });
        return out;
      }
      if(!Object.is(a, b)) out.push(`${ruta}: ${JSON.stringify(a)} -> ${JSON.stringify(b)}`);
      return out;
    };

    const assertIdaVuelta = (etiqueta, original, vuelta) => {
      const difs = diferencias(original, vuelta, 'registro');
      assert(difs.length === 0, `Ida y vuelta ${etiqueta}: vuelve idéntico (claves, valores y tipos)`,
        difs.length ? 'Diferencias:\n' + difs.join('\n') : '');

    const aaBase = () => ({ activo:false, tipo:'monto', monto:0, valor:0, diaDelMes:1, pausado:false, razonPausa:null });

    // ---- filaCuenta / localCuenta ----

    // ---- filaGoal + filasAportes / localGoal ----
    [
      ['meta eliminada con aporte',
        { id:'g1', name:'Viaje', indefinida:false, montoObjetivo:500000, fechaLimite:'2026-12-31', fechaCreacion:'2026-01-10',
          fechaCumplida:null, aportes:[{ id:'ap1', fecha:'2026-02-15', monto:20000, tipo:'manual' }],

          aporteAutomatico:aaBase(), cuentaId:'acc1', _ultimoDoneVisto:true }],

        { id:'g4', name:'Bici', indefinida:false, montoObjetivo:250000, fechaLimite:'2027-03-01', fechaCreacion:'2026-09-01',
          fechaCumplida:null, aportes:[], aporteAutomatico:aaBase() }]
    ].forEach(([et, g]) => {
      const fila = win.filaGoal(g, USER);
      const filasAp = win.filasAportes(g, USER, fila.id).map(viajeNube);
      assertIdaVuelta(`filaGoal+filasAportes/localGoal (${et})`, g, win.localGoal(viajeNube(fila), filasAp));
    });

    // ---- filaConfigCompartida / localConfigCompartida ----
    // filaConfigCompartida lee state.config, así que se inyecta con setState. El original
    // es solo el subconjunto de config que vive en config_compartida.
    [
      ['con mesInicioRegistro y readOnly',
        { categorias:['Comida','Transporte'], metodos:['Efectivo','Crédito'], fuentes:['Sueldo','Otros'],
          categoriaIconos:{ Comida:'🍔' }, categoriaTopes:{ Comida:150000 }, categoriaColores:{ Comida:'#e07a5f' },
          readOnly:true, mesInicioRegistro:24316 }],
      ['sin mesInicioRegistro ("Sin definir")',
        { categorias:['Varios'], metodos:['Efectivo'], fuentes:['Otros'],
          categoriaIconos:{}, categoriaTopes:{}, categoriaColores:{}, readOnly:false }]
    ].forEach(([et, cfg]) => {
      const st = fixtureBase();
      st.config = { ...st.config, categoriaIconos:{}, categoriaTopes:{}, ...cfg };
      if(!('mesInicioRegistro' in cfg)) delete st.config.mesInicioRegistro;
      setState(win, st);
      assertIdaVuelta(`filaConfigCompartida/localConfigCompartida (${et})`, cfg,
        win.localConfigCompartida(viajeNube(win.filaConfigCompartida(USER))));
    });
  }

  // ==================== Escritura continua: núcleo puro (Etapa 2 · Tanda 4a) ====================
  // Solo funciones puras: no leen ni escriben `state` global, localStorage ni la red.
  {
    const USER = 'u-test', DEV = 'dev-A';
    ['jsonCanonico','asegurarIds','construirSnapshot','diffSnapshots','opsResync','coalescerOps',
     'ordenarOps','contarFilasSnapshot','evaluarBorradoMasivo','retrasoReintentoSync','clasificarRespuestaSync'
    ].forEach(nombre=>{
      assert(typeof win[nombre] === 'function', `sync: iframe.contentWindow.${nombre} existe y es function`, `typeof = ${typeof win[nombre]}`);
    });
    assert(win.eval('ESCRITURA_CONTINUA_ACTIVA') === true, 'sync: ESCRITURA_CONTINUA_ACTIVA está en true (activada en producción desde 4ef6696)',
      `valor = ${win.eval('ESCRITURA_CONTINUA_ACTIVA')}`);

    const aaSync = () => ({ activo:false, tipo:'monto', monto:0, valor:0, diaDelMes:1, pausado:false, razonPausa:null });
    const fx = () => {
      const st = fixtureBase();
      st.config.paleta = 'cafe';
      st.expenses.push({ id:'e1', date:'2026-09-01', nombre:'Pan', amount:2000, category:'Comida', method:'Efectivo', description:'', tipo:'Casual', debtId:null, cuentaId:'acc1' });
      st.incomes.push({ id:'i1', date:'2026-09-01', nombre:'Sueldo', source:'Sueldo', amount:900000, description:'', tipo:'Fijo', cuentaId:'acc1' });
      st.goals.push({ id:'g1', name:'Viaje', indefinida:false, montoObjetivo:100000, fechaLimite:'', fechaCreacion:'2026-01-01', fechaCumplida:null,
        aportes:[{ id:'ap1', fecha:'2026-02-01', monto:1000, tipo:'manual' }], aporteAutomatico: aaSync(), cuentaId:'acc1' });
      return st;
    };
    const snap = st => win.construirSnapshot(st, USER, DEV);
    const clon = o => JSON.parse(JSON.stringify(o));
    const resumen = ops => ops.map(o => `${o.tipo} ${o.tabla} ${o.clave}`).join(' | ') || '(sin ops)';

    // JSON canónico
    const j1 = win.jsonCanonico({ b:1, a:{ d:2, c:[3, { f:1, e:2 }] }, z:undefined });
    const j2 = win.jsonCanonico({ a:{ c:[3, { e:2, f:1 }], d:2 }, b:1 });
    assert(j1 === j2 && j1 === '{"a":{"c":[3,{"e":2,"f":1}],"d":2},"b":1}',
      'sync: jsonCanonico da el mismo texto sin importar el orden de las claves (y omite undefined)', `j1 = ${j1}\nj2 = ${j2}`);
    {
      // Mismo contenido, objetos armados con otro orden de claves -> misma foto.
      const a = fx(), b = fx();
      b.expenses[0] = { cuentaId:'acc1', debtId:null, tipo:'Casual', description:'', method:'Efectivo', category:'Comida', amount:2000, nombre:'Pan', date:'2026-09-01', id:'e1' };
      const ops = win.diffSnapshots(snap(a), snap(b));
      assert(ops.length === 0, 'sync: mismo registro con otro orden de claves -> 0 ops', resumen(ops));
    }

    // Sin cambios
    {
      const st = fx();
      const s1 = snap(st), s2 = snap(st), s3 = snap(clon(st));
      const ops = win.diffSnapshots(s1, s2).concat(win.diffSnapshots(s1, s3));
      assert(ops.length === 0, 'sync: guardar dos veces el mismo estado -> 0 ops (también tras ida y vuelta por JSON)', resumen(ops));
      const conUpdated = Object.values(s1).some(t => Object.values(t).some(j => 'updated_at' in JSON.parse(j)));
      assert(!conUpdated, 'sync: ninguna fila de la foto incluye updated_at');
      assert(Object.keys(s1).length === 9, 'sync: la foto trae las 9 tablas', Object.keys(s1).join(', '));
    }

    // config_dispositivo solo con ESTE device
    {
      const s = snap(fx());
      const claves = Object.keys(s.config_dispositivo);
      const fila = JSON.parse(s.config_dispositivo[DEV] || '{}');
      assert(claves.length === 1 && claves[0] === DEV && fila.device_id === DEV && fila.user_id === USER,
        'sync: config_dispositivo solo trae la fila de este device_id', `claves = ${claves.join(', ')}`);
      assert(Object.keys(s.config_compartida).join() === USER, 'sync: config_compartida tiene una sola fila, con clave user_id');
    }

    // Alta / edición / baja
    {
      const antes = fx(), despues = fx();
      despues.expenses.push({ id:'e2', date:'2026-09-02', nombre:'Bus', amount:800, category:'Transporte', method:'Débito', description:'', tipo:'Casual', debtId:null, cuentaId:'acc1' });
      const ops = win.diffSnapshots(snap(antes), snap(despues));
      assert(ops.length === 1 && ops[0].tipo === 'upsert' && ops[0].tabla === 'expenses' && ops[0].clave === 'e2' && ops[0].fila.amount === 800 && ops[0].fila.user_id === USER,
        'sync: alta de un gasto -> 1 upsert en expenses con la fila nueva', resumen(ops));
    }
    {
      const antes = fx(), despues = fx();
      despues.expenses[0].amount = 2500;
      const ops = win.diffSnapshots(snap(antes), snap(despues));
      assert(ops.length === 1 && ops[0].tipo === 'upsert' && ops[0].clave === 'e1' && ops[0].fila.amount === 2500,
        'sync: edición de un gasto -> 1 upsert con el monto nuevo', resumen(ops) + (ops[0] ? ` · amount = ${ops[0].fila.amount}` : ''));
    }
    {
      const antes = fx(), despues = fx();
      despues.expenses = [];
      const ops = win.diffSnapshots(snap(antes), snap(despues));
      assert(ops.length === 1 && ops[0].tipo === 'delete' && ops[0].tabla === 'expenses' && ops[0].clave === 'e1'
        && JSON.stringify(ops[0].fila) === JSON.stringify({ id:'e1', user_id:USER }),
        'sync: baja de un gasto -> 1 delete con solo la PK (id, user_id)', resumen(ops) + (ops[0] ? ` · fila = ${JSON.stringify(ops[0].fila)}` : ''));
    }
    {
      const antes = fx(), despues = fx();
      despues.config.paleta = 'mar';
      const ops = win.diffSnapshots(snap(antes), snap(despues));
      assert(ops.length === 1 && ops[0].tabla === 'config_dispositivo' && ops[0].clave === DEV && ops[0].fila.paleta === 'mar',
        'sync: cambio de preferencia del dispositivo -> 1 upsert en config_dispositivo', resumen(ops));
    }

    // Meta con aportes: orden padre -> hijo en upserts, inverso en deletes
    {
      const antes = fx(), despues = fx();
      despues.goals.push({ id:'g2', name:'Bici', indefinida:false, montoObjetivo:50000, fechaLimite:'', fechaCreacion:'2026-09-01', fechaCumplida:null,
        aportes:[{ id:'ap2', fecha:'2026-09-01', monto:500, tipo:'manual' }, { id:'ap3', fecha:'2026-09-02', monto:700, tipo:'manual' }], aporteAutomatico: aaSync() });
      // Se invierte a propósito (hijos primero) para que el orden lo ponga ordenarOps.
      const ops = win.diffSnapshots(snap(antes), snap(despues)).reverse();
      const ord = win.ordenarOps(ops);
      const iGoal = ord.findIndex(o => o.tabla === 'goals');
      const iAps = ord.map((o, i) => o.tabla === 'goal_aportes' ? i : -1).filter(i => i >= 0);
      assert(ord.length === 3 && iGoal >= 0 && iAps.length === 2 && iAps.every(i => i > iGoal) && ord[iAps[0]].fila.goal_id === 'g2',
        'sync: meta nueva con aportes -> upsert de goals ANTES que los de goal_aportes', resumen(ord));

      const ordDel = win.ordenarOps(win.diffSnapshots(snap(despues), snap(antes)));
      const jGoal = ordDel.findIndex(o => o.tabla === 'goals');
      const jAps = ordDel.map((o, i) => o.tabla === 'goal_aportes' ? i : -1).filter(i => i >= 0);
      assert(ordDel.length === 3 && ordDel.every(o => o.tipo === 'delete') && jAps.length === 2 && jAps.every(i => i < jGoal),
        'sync: meta borrada con aportes -> deletes de goal_aportes ANTES que el de goals', resumen(ordDel));

      const mixto = win.ordenarOps([
        { tabla:'goals', clave:'gX', tipo:'delete' }, { tabla:'goal_aportes', clave:'aY', tipo:'upsert' },
        { tabla:'goal_aportes', clave:'aX', tipo:'delete' }, { tabla:'goals', clave:'gY', tipo:'upsert' }
      ]);
      assert(resumen(mixto) === 'upsert goals gY | upsert goal_aportes aY | delete goal_aportes aX | delete goals gX',
        'sync: ordenarOps pone upserts padre->hijo y después deletes hijo->padre', resumen(mixto));
    }

    // Coalescencia
    {
      const u1 = { tabla:'expenses', clave:'e1', tipo:'upsert', fila:{ id:'e1', amount:1 } };
      const u2 = { tabla:'expenses', clave:'e1', tipo:'upsert', fila:{ id:'e1', amount:2 } };
      const d1 = { tabla:'expenses', clave:'e1', tipo:'delete', fila:{ id:'e1', user_id:USER } };
      const otro = { tabla:'incomes', clave:'e1', tipo:'upsert', fila:{ id:'e1' } };
      const c1 = win.coalescerOps([u1], [u2]);
      assert(c1.length === 1 && c1[0].fila.amount === 2, 'sync: coalescer upsert + upsert -> 1 upsert (el último)', JSON.stringify(c1));
      const c2 = win.coalescerOps([u1, otro], [d1]);
      assert(c2.length === 2 && c2.some(o => o.tabla === 'expenses' && o.tipo === 'delete') && c2.some(o => o.tabla === 'incomes'),
        'sync: coalescer upsert + delete -> delete (misma clave en otra tabla no se toca)', JSON.stringify(c2));
      const c3 = win.coalescerOps([d1], [u2]);
      assert(c3.length === 1 && c3[0].tipo === 'upsert', 'sync: coalescer delete + upsert -> upsert', JSON.stringify(c3));
    }

    // Guarda contra borrado masivo (más del 30% en tablas con 10+ filas)
    {
      const base10 = fx();
      for(let k = 2; k <= 10; k++) base10.expenses.push({ ...base10.expenses[0], id:'e' + k });
      const sBase = snap(base10);
      const conteos = win.contarFilasSnapshot(sBase);
      const borrar = n => { const st = clon(base10); st.expenses = st.expenses.slice(n); return win.diffSnapshots(sBase, snap(st)); };
      const g4 = win.evaluarBorradoMasivo(conteos, borrar(4));
      const g3 = win.evaluarBorradoMasivo(conteos, borrar(3));
      assert(conteos.expenses === 10 && g4.length === 1 && g4[0].tabla === 'expenses' && g4[0].borrar === 4 && g4[0].total === 10,
        'sync: guarda 30% — borrar 4 de 10 gastos (40%) se detiene', JSON.stringify(g4));
      assert(g3.length === 0, 'sync: guarda 30% — borrar 3 de 10 (30% justo) pasa', JSON.stringify(g3));
      const base9 = clon(base10); base9.expenses = base9.expenses.slice(1);
      const sBase9 = snap(base9);
      const todo9 = clon(base9); todo9.expenses = [];
      const g9 = win.evaluarBorradoMasivo(win.contarFilasSnapshot(sBase9), win.diffSnapshots(sBase9, snap(todo9)));
      assert(g9.length === 0, 'sync: guarda 30% — tabla con 9 filas no se vigila (borrar las 9 pasa)', JSON.stringify(g9));
      const gRes = win.evaluarBorradoMasivo({ goals: 20 },
        win.opsResync(snap(fx()), { goals: Array.from({ length: 20 }, (_, k) => ({ id:'nube' + k, user_id:USER })) }));
      assert(gRes.length === 1 && gRes[0].tabla === 'goals' && gRes[0].borrar === 20,
        'sync: guarda 30% en el resync — la nube tiene 20 metas que no existen localmente -> se detiene', JSON.stringify(gRes));
    }

    // Resync inicial
    {
      const s = snap(fx());
      const ops = win.opsResync(s, { expenses: [{ id:'e1', user_id:USER }, { id:'huerfano', user_id:USER }], goals: [] });
      const ups = ops.filter(o => o.tipo === 'upsert'), dels = ops.filter(o => o.tipo === 'delete');
      const totalLocal = Object.values(win.contarFilasSnapshot(s)).reduce((a, b) => a + b, 0);
      assert(ups.length === totalLocal && dels.length === 1 && dels[0].tabla === 'expenses' && dels[0].clave === 'huerfano',
        'sync: resync = upsert de todo lo local + delete solo de lo que la nube tiene y lo local no', `${ups.length} upserts (local ${totalLocal}) · ${resumen(dels)}`);
    }

    // Ids estables
    {
      const st = fx();
      delete st.expenses[0].id;
      delete st.goals[0].aportes[0].id;
      let lanzo = false;
      try{ win.construirSnapshot(st, USER, DEV); }catch(_){ lanzo = true; }
      assert(lanzo, 'sync: construirSnapshot se niega a fotografiar un registro sin id (no inventa ids aleatorios)');
      let n = 0;
      const gen = () => 'nuevo' + (++n);
      const asignados = win.asegurarIds(st, gen);
      const otraVez = win.asegurarIds(st, gen);
      assert(asignados === 2 && otraVez === 0 && st.expenses[0].id === 'nuevo1' && st.goals[0].aportes[0].id === 'nuevo2',
        'sync: asegurarIds asigna id a gastos y aportes sin id una sola vez', `asignados = ${asignados}, segunda pasada = ${otraVez}`);
      const ops = win.diffSnapshots(snap(st), snap(st));
      assert(ops.length === 0, 'sync: con ids asegurados, dos fotos seguidas -> 0 ops', resumen(ops));
    }

    // Clasificación de errores y backoff
    {
      const c = win.clasificarRespuestaSync;
      const ok = c({ error:null, status:201 }) === 'ok' && c({ error:{}, status:0 }) === 'red' && c({ error:{}, status:503 }) === 'red'
        && c({ error:{}, status:401 }) === 'red' && c({ error:{}, status:429 }) === 'red'
        && c({ error:{}, status:400 }) === 'permanente' && c({ error:{}, status:403 }) === 'permanente' && c({ error:{}, status:409 }) === 'permanente';
      assert(ok, 'sync: clasificación — sin red/5xx/401/429 se reintenta; 400/403/409 va a fallidas');
      const r = [1, 2, 3, 4, 7, 20].map(win.retrasoReintentoSync);
      assert(JSON.stringify(r) === JSON.stringify([1000, 2000, 4000, 8000, 60000, 60000]),
        'sync: backoff 1s, 2s, 4s, 8s… con tope 60s', JSON.stringify(r));
    }

    // ---- Tanda 4a.1: escritor único y dispositivo legado ----
    {
      const r = win.resultadoReclamoEscritor;
      const casos = [
        [r({ data:[{ dispositivo_escritor: DEV }], error:null }, DEV), 'gano'],
        [r({ data:[], error:null }, DEV), 'otro'],                                    // el WHERE no calzó: hay otro escritor
        [r({ data:[{ dispositivo_escritor: 'otro-dev' }], error:null }, DEV), 'otro'],
        [r({ data:null, error:{ message:'fetch failed' }, status:0 }, DEV), 'error'],
        [r(undefined, DEV), 'error']
      ];
      assert(casos.every(([obt, esp]) => obt === esp),
        'escritor: 1 fila con este device = ganó; 0 filas = lo tiene otro; error = no se sabe',
        casos.map(([o, e]) => o + '/' + e).join(' · '));
    }
    {
      // Carrera: dos dispositivos reclaman a la vez contra la MISMA fila. Se simula el WHERE
      // atómico (null o = yo) aplicado en serie, que es lo que garantiza Postgres.
      const fila = { dispositivo_escritor: null };
      const reclamar = dev => {
        if(fila.dispositivo_escritor === null || fila.dispositivo_escritor === dev){
          fila.dispositivo_escritor = dev;
          return { data:[{ dispositivo_escritor: dev }], error:null };
        }
        return { data:[], error:null };
      };
      const a = win.resultadoReclamoEscritor(reclamar('dev-A'), 'dev-A');
      const b = win.resultadoReclamoEscritor(reclamar('dev-B'), 'dev-B');
      const a2 = win.resultadoReclamoEscritor(reclamar('dev-A'), 'dev-A');
      assert(a === 'gano' && b === 'otro' && a2 === 'gano' && fila.dispositivo_escritor === 'dev-A',
        'escritor: dos reclamos seguidos -> un solo ganador, el perdedor nunca pisa; el ganador puede re-reclamar',
        `A=${a} B=${b} A otra vez=${a2} fila=${fila.dispositivo_escritor}`);
    }
    {
      const d = win.decidirLegado;
      const base = { haySesion:true, tieneFila:true, dueno:null, existeConfigNube:true, escritor:null, deviceId:DEV };
      const casos = [
        ['legado con escritor vacío', d(base), 'ofrecer'],
        ['legado y ya es el escritor', d({ ...base, escritor:DEV }), 'ofrecer'],
        ['escritor ajeno', d({ ...base, escritor:'otro-dev' }), 'escritor-ajeno'],
        ['candado de esta cuenta', d({ ...base, dueno:USER }), 'no-aplica'],
        ['candado de OTRA cuenta (caso C)', d({ ...base, dueno:'otra-cuenta' }), 'no-aplica'],
        ['candado de otra cuenta + escritor ajeno', d({ ...base, dueno:'otra-cuenta', escritor:'otro-dev' }), 'no-aplica'],
        ['sin fila en config_dispositivo', d({ ...base, tieneFila:false }), 'no-aplica'],
        ['sin sesión', d({ ...base, haySesion:false }), 'no-aplica'],
        ['sin config_compartida en la nube', d({ ...base, existeConfigNube:false }), 'no-aplica']
      ];
      const malos = casos.filter(([, obt, esp]) => obt !== esp);
      assert(malos.length === 0, 'legado: se ofrece solo con sesión + fila propia + candado null + escritor null o este device',
        malos.map(([n, o, e]) => `${n}: ${o} (esperado ${e})`).join(' · ') || casos.length + ' casos');
    }
    {
      const c = win.escritorCambioAOtro;
      const ok = c({ user_id:USER, dispositivo_escritor:'otro-dev' }, DEV) === true
        && c({ user_id:USER, dispositivo_escritor:null }, DEV) === true
        && c({ user_id:USER, dispositivo_escritor:DEV }, DEV) === false
        && c({ user_id:USER, categorias:[] }, DEV) === false   // evento sin la columna: no decide nada
        && c(null, DEV) === false;
      assert(ok, 'escritor: un UPDATE de config_compartida con otro escritor (u null) detiene; con este device, no');
    }
    {
      const cfg = { ...fx().config, categorias:['A'], mesInicioRegistro:'2026-01' };
      const fila = win.filaConfigCompartida(USER, cfg);
      const leida = win.localConfigCompartida({ ...fila, dispositivo_escritor: DEV, updated_at: '2026-09-25T00:00:00Z' });
      assert(!('dispositivo_escritor' in fila) && !('dispositivoEscritor' in leida) && !('dispositivo_escritor' in leida),
        'escritor: filaConfigCompartida no manda dispositivo_escritor (el upsert no lo toca) y localConfigCompartida lo ignora',
        'fila: ' + Object.keys(fila).join(',') + ' · leída: ' + Object.keys(leida).join(','));
    }
    {
      const t = win.textoConteosLegado;
      const a = t({ expenses:89, incomes:3, debts:2, goals:1 });
      const b = t({ expenses:1, incomes:0, debts:1, goals:0 });
      assert(a === '89 gastos, 3 ingresos, 2 deudas y 1 meta' && b === '1 gasto, 0 ingresos, 1 deuda y 0 metas',
        'legado: texto de conteos con singular/plural', a + ' · ' + b);
    }
  }

  // ==================== T22 — prepararDatosExport() (Excel con ExcelJS) ====================
  // Función pura que arma filas y totales del libro. Las fechas del fixture son RELATIVAS
  // a hoy (mes pasado, mes actual, mes siguiente) porque "Proyectado" depende de
  // fechaHoyLocalISO() y de esMesCerrado(), que leen el reloj real.
  {
    assert(typeof win.prepararDatosExport === 'function', 'iframe.contentWindow.prepararDatosExport existe y es function',
      `typeof = ${typeof win.prepararDatosExport}`);
    const hoy = new Date();
    const Y = hoy.getFullYear(), M = hoy.getMonth();
    const iso = (y, m, d)=>{ const x = new Date(y, m, d); return x.getFullYear() + '-' + String(x.getMonth()+1).padStart(2,'0') + '-' + String(x.getDate()).padStart(2,'0'); };
    const primero = off => new Date(Y, M + off, 1);
    const ultimo  = off => new Date(Y, M + off + 1, 0);
    const hoyISO = iso(Y, M, hoy.getDate());

    const st = fixtureBase();
    st.incomes.push({ id:'xI1', date: iso(Y, M-2, 1), amount: 800000, tipo:'Fijo', source:'Sueldo', nombre:'Sueldo', description:'Sueldo' });
    st.incomes.push({ id:'xI2', date: iso(Y, M-1, 5), amount: 120000, tipo:'Casual', source:'Ventas', nombre:'Venta bicicleta', description:'Usada' });
    st.expenses.push({ id:'xG1', date: iso(Y, M-2, 15), amount: 2990, tipo:'Fijo', category:'Cuentas y Servicios', method:'Crédito', nombre:'iCloud', description:'iCloud' });
    st.expenses.push({ id:'xG2', date: iso(Y, M-1, 10), amount: 60000, tipo:'Casual', category:'Comida', method:'Débito', nombre:'Supermercado', description:'  supermercado ' });
    st.expenses.push({ id:'xG3', date: iso(Y, M-1, 12), amount: 15000, tipo:'Casual', category:'Salud', method:'Efectivo', nombre:'Farmacia', description:'Remedios' });
    st.expenses.push({ id:'xG4', date: hoyISO, amount: 3500, tipo:'Casual', category:'Comida', method:'Débito', nombre:'Café', description:'' });
    // Compra en 6 cuotas hecha hace 3 meses (fila de origen con debtId, como la crea la app):
    // cuotas en M-2, M-1 (meses cerrados) y M (confirmada a mano) -> 3 pagadas, 3 restantes.
    st.expenses.push({ id:'xG5', date: iso(Y, M-3, 3), amount: 300000, tipo:'Casual', category:'Vestimenta', method:'Crédito', nombre:'Chaqueta', description:'Chaqueta', debtId:'xD1' });
    st.debts.push({ id:'xD1', purchaseDate: iso(Y, M-3, 3), numCuotas: 6, totalAmount: 300000, category:'Vestimenta', description:'Chaqueta',
      manualPaidMonthKeys: [mk(primero(0))], manualUnpaidMonthKeys: [] });
    // Segunda compra, cuota del mes en curso SIN confirmar: así T.cuotas (todas) ≠ T.cuotasGasto
    // (sólo confirmadas) y la prueba (a) distingue cuál de las dos exporta el Resumen.
    st.debts.push({ id:'xD2', purchaseDate: iso(Y, M-1, 3), numCuotas: 2, totalAmount: 80000, category:'Entretenimiento', description:'Audífonos',
      manualPaidMonthKeys: [], manualUnpaidMonthKeys: [] });
    st.goals.push({ id:'xM1', name:'Viaje', indefinida:false, montoObjetivo: 1000000, fechaCreacion: iso(Y, M-3, 1),
      aportes: [{ id:'xA1', fecha: iso(Y, M-1, 20), monto: 50000, tipo:'manual' }],
      aporteAutomatico: { activo:true, tipo:'monto', monto:20000, diaDelMes:5, fechaActivacion: iso(Y, M-3, 1) } });
    st.goals.push({ id:'xM2', name:'Colchón', indefinida:true, fechaCreacion: iso(Y, M-2, 1),
      aportes: [{ id:'xA2', fecha: iso(Y, M-2, 8), monto: 30000, tipo:'manual' }] });
    setState(win, st);
    resetCaches(win);

    // ---- (a) mes único: Resumen == resumenTotalesDelMes() y Disponible == desgloseDisponible() ----
    [[-1, 'mes cerrado'], [0, 'mes en curso']].forEach(([off, nombre])=>{
      const ref = primero(off);
      const d = win.prepararDatosExport(primero(off), ultimo(off), 'total');
      const T = win.resumenTotalesDelMes(ref, 'total');
      const dsg = win.desgloseDisponible(ref, true, 'total');
      const r = d.resumen;
      const sumaTerm = r.disponible ? r.disponible.terminos.reduce((s,t)=> s + t.signo * t.monto, 0) : NaN;
      assert(d.meta.mesUnico && r.ingresos === T.ingresos && r.gastosContado === T.gastos && r.cuotas === T.cuotasGasto &&
        r.aportes === T.aportesMetas && Math.round(r.balance) === Math.round(T.dispLibre - T.saldoAnterior),
        `prepararDatosExport (a): ${nombre} — Ingresos, Contado, Cuotas, Aportes y Balance = resumenTotalesDelMes()`,
        `export: ${r.ingresos}/${r.gastosContado}/${r.cuotas}/${r.aportes}/bal ${r.balance} · motor: ${T.ingresos}/${T.gastos}/${T.cuotasGasto}/${T.aportesMetas}/bal ${T.dispLibre - T.saldoAnterior}`);
      assert(r.disponible && r.disponible.disponible === dsg.disponible && r.disponible.disponible === T.dispLibre &&
        Math.round(sumaTerm) === Math.round(dsg.disponible) && r.disponible.cuadra === true,
        `prepararDatosExport (a): ${nombre} — Disponible = desgloseDisponible() y sus términos suman el Disponible`,
        `export: ${r.disponible && r.disponible.disponible} · desglose: ${dsg.disponible} · Σ términos: ${sumaTerm}`);
      const dona = win.donaResumenData(ref, 'total');
      assert(Math.round(r.totalCategorias) === Math.round(dona.total) && r.categorias.every((c,i,a)=> i === 0 || a[i-1].monto >= c.monto),
        `prepararDatosExport (a): ${nombre} — gasto por categoría suma lo mismo que la dona y va de mayor a menor`,
        `categorías: ${Math.round(r.totalCategorias)} · dona: ${Math.round(dona.total)}`);
    });

    // ---- (b) Proyectado vs Registrado (rango M-2 .. M+1, como "Todo el historial") ----
    {
      const d = win.prepararDatosExport(primero(-2), ultimo(1), 'total');
      const icloud = d.gastos.filas.filter(f=> f.nombre === 'iCloud');
      const pasada = icloud.find(f=> f.fecha.slice(0,7) === iso(Y, M-1, 1).slice(0,7));
      const futura = icloud.find(f=> f.fecha.slice(0,7) === iso(Y, M+1, 1).slice(0,7));
      const cafe = d.gastos.filas.find(f=> f.nombre === 'Café');
      const sueldoFut = d.ingresos.filas.find(f=> f.nombre === 'Sueldo' && f.fecha.slice(0,7) === iso(Y, M+1, 1).slice(0,7));
      assert(icloud.length === 4 && pasada && pasada.estado === 'Registrado' && futura && futura.estado === 'Proyectado' &&
        cafe && cafe.estado === 'Registrado' && sueldoFut && sueldoFut.estado === 'Proyectado' &&
        d.gastos.filas.every(f=> f.estado === (f.fecha > hoyISO ? 'Proyectado' : 'Registrado')),
        'prepararDatosExport (b): ocurrencia fija futura = "Proyectado", pasada y la de hoy = "Registrado"',
        `iCloud: ${icloud.map(f=> f.fecha + ' ' + f.estado).join(', ')} · Café(hoy): ${cafe && cafe.estado} · Sueldo M+1: ${sueldoFut && sueldoFut.estado}`);
      const ultimoMes = d.resumen.meses[d.resumen.meses.length - 1];
      const mesActual = d.resumen.meses.find(x=> x.mes === iso(Y, M, 1));
      assert(!d.meta.mesUnico && d.resumen.disponible === null && d.resumen.meses.length === 4 &&
        d.resumen.meses[0].estado === 'Cerrado' && mesActual.estado === 'En curso' && ultimoMes.estado === 'Proyectado',
        'prepararDatosExport (b): tabla por mes con Estado del mes Cerrado / En curso / Proyectado (sin Disponible si hay varios meses)',
        d.resumen.meses.map(x=> x.etiqueta + ': ' + x.estado).join(' · '));
    }

    // ---- (c) Descripción igual al Nombre -> vacía ----
    {
      const d = win.prepararDatosExport(primero(-2), ultimo(0), 'total');
      const s = d.gastos.filas.find(f=> f.nombre === 'Supermercado');
      const f = d.gastos.filas.find(f=> f.nombre === 'Farmacia');
      const i1 = d.ingresos.filas.find(f=> f.nombre === 'Sueldo');
      const i2 = d.ingresos.filas.find(f=> f.nombre === 'Venta bicicleta');
      assert(s && s.descripcion === '' && f && f.descripcion === 'Remedios' && i1 && i1.descripcion === '' && i2 && i2.descripcion === 'Usada',
        'prepararDatosExport (c): si la Descripción repite el Nombre, sale vacía (gastos e ingresos); si no, se conserva',
        `Supermercado: "${s && s.descripcion}" · Farmacia: "${f && f.descripcion}" · Sueldo: "${i1 && i1.descripcion}" · Venta: "${i2 && i2.descripcion}"`);
    }

    // ---- (d) Cuotas: pagadas + restantes = N° y saldo = restantes × valor cuota (motor) ----
    {
      const d = win.prepararDatosExport(primero(0), ultimo(0), 'total');
      const c = d.cuotas.filas.find(x=> x.descripcion === 'Chaqueta');
      const deuda = st.debts[0];
      const info = win.cuotaInfoForMonth(deuda, win.addMonths(deuda.purchaseDate, 1));
      assert(c && c.pagadas + c.restantes === c.numCuotas && c.numCuotas === 6 && c.pagadas === 3 &&
        c.valorCuota === info.monto && c.saldoPendiente === c.restantes * info.monto &&
        d.cuotas.filas.every(x=> x.pagadas + x.restantes === x.numCuotas) &&
        d.cuotas.totalSaldo === d.cuotas.filas.reduce((s,x)=> s + x.saldoPendiente, 0),
        'prepararDatosExport (d): cuotas pagadas + restantes = N° de cuotas y saldo pendiente = restantes × valor cuota',
        c ? `pagadas ${c.pagadas} + restantes ${c.restantes} = ${c.numCuotas} · saldo ${c.saldoPendiente} = ${c.restantes} × ${info.monto} · próxima ${c.proxima}` : 'sin fila');
    }

    // ---- (e) Metas == ahorradoDeMeta() ----
    {
      const d = win.prepararDatosExport(primero(0), ultimo(0), 'total');
      const hoyMes = win.mesActualReal();
      const ok = st.goals.every(g=>{
        const fila = d.metas.filas.find(x=> x.meta === g.name);
        return fila && fila.ahorrado === win.ahorradoDeMeta(g, hoyMes);
      });
      const viaje = d.metas.filas.find(x=> x.meta === 'Viaje');
      const colchon = d.metas.filas.find(x=> x.meta === 'Colchón');
      assert(ok && d.metas.filas.length === 2 && viaje.aporteAuto === 20000 && viaje.estado === 'En curso' &&
        viaje.pct === Math.min(100, Math.round(viaje.ahorrado / 1000000 * 100)) / 100 &&
        colchon.objetivo === null && colchon.pct === null && colchon.aporteAuto === 'No',
        'prepararDatosExport (e): Ahorrado de cada meta = ahorradoDeMeta(); % y aporte automático como en la pestaña Metas',
        d.metas.filas.map(x=> `${x.meta}: ahorrado ${x.ahorrado}, ${x.pct === null ? 'sin %' : Math.round(x.pct*100)+'%'}, auto ${x.aporteAuto}, ${x.estado}`).join(' · '));
    }

    // ---- (f) Cuotas pendientes (no descontadas) = la línea "Cuotas pendientes" de la app ----
    // Mes en curso: la cuota de Audífonos está sin confirmar -> renderResumen() muestra
    // T.cuotasPendientes como "NO DESCONTADO". Mes cerrado (M-1): la cuota de Chaqueta quedó
    // sin confirmar, pero la app ya la cuenta como gasto (nota, no pendiente) -> 0.
    {
      const d = win.prepararDatosExport(primero(-1), ultimo(0), 'total');
      const cerrado = d.resumen.meses[0], enCurso = d.resumen.meses[1];
      const Tc = win.resumenTotalesDelMes(primero(-1), 'total');
      const Tv = win.resumenTotalesDelMes(primero(0), 'total');
      assert(Tv.cerrado === false && Tv.cuotasPendientes > 0 && enCurso.cuotasPendientes === Tv.cuotasPendientes &&
        enCurso.balanceSiPagan === enCurso.balance - enCurso.cuotasPendientes &&
        Tc.cerrado === true && cerrado.cuotasPendientes === 0 && cerrado.balanceSiPagan === cerrado.balance &&
        d.resumen.cuotasPendientes === enCurso.cuotasPendientes &&
        d.resumen.balanceSiPagan === d.resumen.balance - d.resumen.cuotasPendientes,
        'prepararDatosExport (f): cuotas pendientes = T.cuotasPendientes de la app (0 en mes cerrado) y Balance si se pagan = Balance − pendientes',
        `en curso: pendientes ${enCurso.cuotasPendientes} (app ${Tv.cuotasPendientes}), balance ${enCurso.balance} → si se pagan ${enCurso.balanceSiPagan} · ` +
        `cerrado: exportado ${cerrado.cuotasPendientes} (T.cuotasPendientes crudo ${Tc.cuotasPendientes}, ya cuenta como gasto)`);
    }

    // ---- (g) grupoMesExport(): previo / real / proyectado ----
    {
      const g = win.grupoMesExport;
      const h = mk(primero(0));
      const casos = [
        [g(h - 3, h - 1, h), 'previo'], [g(h - 1, h - 1, h), 'real'], [g(h, h - 1, h), 'real'],
        [g(h + 1, h - 1, h), 'proyectado'], [g(h - 3, null, h), 'real'], [g(h + 2, null, h), 'proyectado'],
        [g(h + 1, h + 2, h), 'previo']
      ];
      assert(typeof g === 'function' && casos.every(([a, b])=> a === b),
        'prepararDatosExport (g): grupoMesExport clasifica previo (antes del inicio de registro) / real (inicio..mes actual) / proyectado (posterior al actual)',
        casos.map(([a, b])=> `${a}${a === b ? '' : ' ≠ ' + b}`).join(', '));
    }

    // ---- (h) Totales solo con meses reales: inicio de registro = M-1, rango M-2 .. M+1 ----
    // M-2 = previo, M-1 y M = reales, M+1 = proyectado (va a Compromisos futuros).
    {
      const stR = JSON.parse(JSON.stringify(st));
      stR.config.mesInicioRegistro = iso(Y, M-1, 1).slice(0, 7);
      setState(win, stR);
      resetCaches(win);
      const d = win.prepararDatosExport(primero(-2), ultimo(1), 'total');
      const r = d.resumen;
      const Ta = win.resumenTotalesDelMes(primero(-1), 'total'), Tb = win.resumenTotalesDelMes(primero(0), 'total');
      const balAB = (Ta.ingresos - Ta.gastos - Ta.cuotasGasto - Ta.aportesMetas) + (Tb.ingresos - Tb.gastos - Tb.cuotasGasto - Tb.aportesMetas);
      const donaAB = win.donaResumenData(primero(-1), 'total').total + win.donaResumenData(primero(0), 'total').total;
      const sc = win.cuotasSinConfirmarDelMes(primero(1), 'total');
      const NOMBRES = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
      const lower = off=> NOMBRES[primero(off).getMonth()] + ' ' + primero(off).getFullYear();
      assert(r.meses.map(x=> x.grupo).join() === 'previo,real,real,proyectado' && r.meses[0].estado === 'Anterior al registro' &&
        r.hayReales === true && r.ingresos === Ta.ingresos + Tb.ingresos && r.gastosContado === Ta.gastos + Tb.gastos &&
        r.cuotas === Ta.cuotasGasto + Tb.cuotasGasto && r.aportes === Ta.aportesMetas + Tb.aportesMetas &&
        Math.round(r.balance) === Math.round(balAB) && r.cuotasPendientes === Tb.cuotasPendientes &&
        Math.round(r.totalCategorias) === Math.round(donaAB) &&
        r.totalesTexto === lower(-1) + ' – ' + lower(0),
        'prepararDatosExport (h): totales (ingresos, gastos, cuotas, balance, categorías, pendientes) = solo meses reales; el previo queda "Anterior al registro"',
        `grupos: ${r.meses.map(x=> x.etiqueta + '=' + x.grupo).join(', ')} · ingresos ${r.ingresos} (reales ${Ta.ingresos + Tb.ingresos}) · balance ${r.balance} (reales ${balAB}) · ` +
        `categorías ${Math.round(r.totalCategorias)} (dona reales ${Math.round(donaAB)}) · totales: «${r.totalesTexto}»`);
      assert(r.compromisos.length === 1 && r.compromisos[0].mes === iso(Y, M+1, 1) &&
        r.compromisos[0].cuotas === sc.count && r.compromisos[0].total === sc.total && sc.count > 0,
        'prepararDatosExport (h): el mes proyectado sale de los totales y pasa a Compromisos futuros (cuotas por pagar y total)',
        r.compromisos.map(c=> `${c.etiqueta}: ${c.cuotas} cuota(s), ${c.total}`).join(' · ') + ` · motor: ${sc.count}, ${sc.total}`);

      // ---- (i) Rango solo futuro: sin meses reales -> totales en 0 y el texto lo dice ----
      const f = win.prepararDatosExport(primero(1), ultimo(2), 'total');
      const rf = f.resumen;
      assert(rf.hayReales === false && rf.totalesTexto === 'Sin meses registrados en el período' &&
        rf.ingresos === 0 && rf.balance === 0 && rf.categorias.length === 0 && rf.disponible === null &&
        rf.compromisos.length === 2,
        'prepararDatosExport (i): rango sin meses reales -> «Sin meses registrados en el período», sin totales, solo compromisos',
        `hayReales ${rf.hayReales} · «${rf.totalesTexto}» · compromisos: ${rf.compromisos.map(c=> c.etiqueta + ' ' + c.total).join(', ')}`);

      // ---- (j) Un solo mes (el actual): Disponible presente, sin compromisos ----
      const u = win.prepararDatosExport(primero(0), ultimo(0), 'total');
      assert(u.meta.mesUnico && u.resumen.hayReales && u.resumen.disponible && u.resumen.compromisos.length === 0 &&
        u.resumen.totalesTexto === lower(0) && u.resumen.ingresos === Tb.ingresos,
        'prepararDatosExport (j): un solo mes actual -> totales del mes, Disponible y sin bloque de compromisos',
        `totales: «${u.resumen.totalesTexto}» · compromisos ${u.resumen.compromisos.length} · disponible ${u.resumen.disponible && u.resumen.disponible.disponible}`);
      setState(win, st);
      resetCaches(win);
    }
  }

  // ==================== T22 — compartirExport(): AbortError silencioso, otros errores -> descarga ====================
  // Se reemplazan navigator.share/canShare del iframe y showToast/descargarBlob por espías.
  {
    const nav = win.navigator;
    const orig = { showToast: win.showToast, descargarBlob: win.descargarBlob };
    let toasts = [], descargas = 0, llamadasShare = 0;
    win.showToast = (msg)=>{ toasts.push(msg); };
    win.descargarBlob = ()=>{ descargas++; };
    const stub = (err, puede)=>{
      Object.defineProperty(nav, 'canShare', { value: ()=> puede, configurable: true });
      Object.defineProperty(nav, 'share', { value: ()=>{ llamadasShare++; return err ? Promise.reject(err) : Promise.resolve(); }, configurable: true });
    };
    const r = { blob: new win.Blob(['x']), filename: 'Telora_test.xlsx' };
    const caso = async (err, puede)=>{
      toasts = []; descargas = 0; llamadasShare = 0;
      stub(err, puede);
      const p = win.compartirExport(r);
      const sincronico = llamadasShare;   // share debe llamarse en el mismo tick (iOS)
      const res = await p;
      return { res, sincronico, llamadasShare, toasts: toasts.slice(), descargas };
    };
    try{
      const a = await caso(new win.DOMException('Share canceled', 'AbortError'), true);
      assert(a.res === 'cancelado' && a.sincronico === 1 && a.toasts.length === 0 && a.descargas === 0,
        'compartirExport: AbortError (se cerró el diálogo) -> silencio: sin toast y sin descarga; share llamado en el mismo tick',
        JSON.stringify(a));
      const b = await caso(new win.DOMException('Permission denied', 'NotAllowedError'), true);
      assert(b.res === 'descarga' && b.sincronico === 1 && b.descargas === 1 && b.toasts.join() === 'Se descargó el archivo',
        'compartirExport: NotAllowedError (Chrome de escritorio con .xlsx) -> descarga automática del mismo archivo + toast «Se descargó el archivo»',
        JSON.stringify(b));
      const c = await caso(null, false);
      assert(c.res === 'descarga' && c.llamadasShare === 0 && c.descargas === 1 && c.toasts.join() === 'Se descargó el archivo',
        'compartirExport: canShare falso -> no llama a share; descarga + toast',
        JSON.stringify(c));
      const e = await caso(null, true);
      assert(e.res === 'compartido' && e.sincronico === 1 && e.descargas === 0 && e.toasts.length === 0,
        'compartirExport: share exitoso -> sin descarga ni toast',
        JSON.stringify(e));
    }finally{
      delete nav.canShare; delete nav.share;
      win.showToast = orig.showToast; win.descargarBlob = orig.descargarBlob;
    }
  }

  // ==================== T2b — Eliminar mi cuenta (sin red: todo con stubs) ====================
  // Nada de esto toca el localStorage real: el apartado/restauración de la cola y el borrado
  // local corren contra un almacenamiento falso (AlmacenFalso); supa, syncTransporte,
  // syncAlmacen, showToast y compañía se reemplazan y se restauran en cada finally.
  {
    class AlmacenFalso {
      constructor(obj){ this.m = new Map(Object.entries(obj || {})); }
      get length(){ return this.m.size; }
      key(i){ return [...this.m.keys()][i] ?? null; }
      getItem(k){ return this.m.has(k) ? this.m.get(k) : null; }
      setItem(k, v){ this.m.set(k, String(v)); }
      removeItem(k){ this.m.delete(k); }
    }
    const $ = id => win.document.getElementById(id);
    const tick = ms => new Promise(r => setTimeout(r, ms));
    const UID = 'uid-prueba-t2b';
    const opA = { tabla: 'expenses', clave: 'e1', tipo: 'upsert', fila: { id: 'e1', user_id: UID }, v: 'a.0', intentos: 0, proximo: 0 };
    const opB = { tabla: 'goals', clave: 'g1', tipo: 'upsert', fila: { id: 'g1', user_id: UID }, v: 'a.1', intentos: 0, proximo: 0 };
    const opC = { tabla: 'incomes', clave: 'i1', tipo: 'upsert', fila: { id: 'i1', user_id: UID }, v: 'b.0', intentos: 0, proximo: 0 };
    const err23503 = { code: '23503', message: 'insert or update on table "expenses" violates foreign key constraint "expenses_user_id_fkey"',
                       details: 'Key (user_id)=(' + UID + ') is not present in table "users".' };

    // ---- (a) El botón solo aparece con sesión ----
    {
      const sin = $('cuentaUsuarioSinSesion'), con = $('cuentaUsuarioConSesion'), btn = $('btnEliminarCuenta');
      const antes = { sin: sin.style.display, con: con.style.display, email: $('cuentaUsuarioEmail').textContent };
      try{
        win.renderCuentaUsuario(null);
        const sinSesion = { conOculto: con.style.display === 'none', sinVisible: sin.style.display !== 'none' };
        win.renderCuentaUsuario({ user: { email: 'prueba@ejemplo.cl', user_metadata: {} } });
        const conSesion = { conVisible: con.style.display !== 'none', sinOculto: sin.style.display === 'none' };
        assert(!!btn && con.contains(btn) && !sin.contains(btn) && sinSesion.conOculto && sinSesion.sinVisible && conSesion.conVisible && conSesion.sinOculto,
          'T2b (a): «Eliminar mi cuenta» vive en el bloque con sesión: oculto sin sesión, visible con sesión; el bloque sin sesión no cambia',
          JSON.stringify({ sinSesion, conSesion, texto: btn && btn.textContent }));
      }finally{
        win.renderCuentaUsuario(null);   // también devuelve el avatar del topbar a "sin sesión"
        sin.style.display = antes.sin; con.style.display = antes.con; $('cuentaUsuarioEmail').textContent = antes.email;
      }
    }

    // ---- (b) El botón final exige escribir ELIMINAR ----
    {
      const inp = $('inpEliminarCuentaConfirma'), conf = $('btnEliminarCuentaConfirmar');
      const probar = v => { inp.value = v; inp.dispatchEvent(new win.Event('input')); win.actualizarBotonesEliminarCuenta(true); return conf.disabled; };
      try{
        const r = { vacio: probar(''), minus: probar('eliminar'), parcial: probar('ELIMINA'), otro: probar('BORRAR'), exacto: probar('ELIMINAR'), espacios: probar('  ELIMINAR ') };
        assert(r.vacio && r.minus && r.parcial && r.otro && !r.exacto && !r.espacios,
          'T2b (b): el botón final queda deshabilitado hasta escribir ELIMINAR (mayúsculas; espacios alrededor se ignoran)',
          JSON.stringify(r));
        assert(win.confirmacionEliminarValida('ELIMINAR') && !win.confirmacionEliminarValida('Eliminar') && !win.confirmacionEliminarValida(null),
          'T2b (b): confirmacionEliminarValida solo acepta ELIMINAR');
      }finally{
        inp.value = ''; win.actualizarBotonesEliminarCuenta(true);
      }
    }

    // ---- (c) Sin conexión: botón deshabilitado con el texto pedido ----
    {
      const btn = $('btnEliminarCuenta'), conf = $('btnEliminarCuentaConfirmar'), inp = $('inpEliminarCuentaConfirma');
      try{
        inp.value = 'ELIMINAR';
        win.actualizarBotonesEliminarCuenta(false);
        const off = { disabled: btn.disabled, texto: btn.textContent, confDisabled: conf.disabled };
        win.actualizarBotonesEliminarCuenta(true);
        const on = { disabled: btn.disabled, texto: btn.textContent };
        assert(off.disabled && off.texto === 'Necesitas conexión para eliminar tu cuenta' && off.confDisabled && !on.disabled && on.texto === 'Eliminar mi cuenta',
          'T2b (c): sin conexión el botón queda deshabilitado con «Necesitas conexión para eliminar tu cuenta» (y el final tampoco se puede usar); con conexión vuelve',
          JSON.stringify({ off, on }));
