    // ---- (d) Pureza: 23503 contra auth.users vs. otras FK; borrado local conserva solo device_id ----
    {
      const goalsFk = { code: '23503', details: 'Key (user_id, goal_id)=(x, y) is not present in table "goals".' };
      assert(win.esErrorCuentaEliminada({ error: err23503, status: 409 }) && !win.esErrorCuentaEliminada({ error: goalsFk, status: 409 })
        && !win.esErrorCuentaEliminada({ error: { code: '23505' }, status: 409 }) && !win.esErrorCuentaEliminada({ error: null }),
        'T2b (d): esErrorCuentaEliminada = 23503 contra la tabla "users" (no la FK goal_aportes -> goals ni otros códigos)');
      const ls = new AlmacenFalso({ misfinanzas_data: '{}', misfinanzas_build: 'x', telora_device_id: 'dev-1', telora_dueno_confirmado: UID,
        ['telora_sync_cola:' + UID]: '[]', 'sb-ekavuxaznjbvrzpxtslz-auth-token': '{}' });
      const borradas = win.borrarDatosLocalesTelora(ls);
      assert(ls.length === 1 && ls.getItem('telora_device_id') === 'dev-1' && borradas.length === 5,
        'T2b (d): borrarDatosLocalesTelora borra todo el almacenamiento salvo telora_device_id',
        'borradas: ' + borradas.sort().join(', '));
    }

    // ---- (e)–(g) Orquestación: detener sync -> esperar envío en vuelo -> apartar -> invocar -> cerrar sesión ----
    const origE = {
      leerDuenoConfirmado: win.leerDuenoConfirmado, esPestanaLiderSync: win.esPestanaLiderSync,
      upsert: win.eval('syncTransporte').upsert
    };
    try{
      win.leerDuenoConfirmado = () => UID;
      win.esPestanaLiderSync = () => true;
      let envios = 0;
      win.eval('syncTransporte').upsert = async () => { envios++; return { error: null, status: 201 }; };

      // (e) Éxito con escrituras pendientes y un envío en vuelo al pedir la eliminación.
      const ls = new AlmacenFalso({ ['telora_sync_cola:' + UID]: JSON.stringify([opA, opB]), ['telora_sync_base:' + UID]: '{"x":1}' });
      const log = [];
      let colaDuranteInvocar = 'sin-leer', vaciandoDuranteInvocar = null;
      win.eval('syncCtx = { userId: "' + UID + '", deviceId: "dev-t2b", esEscritor: true }; syncVaciando = true;');
      setTimeout(() => { log.push('termina-envio-en-vuelo'); win.eval('syncVaciando = false;'); }, 150);
      const base = win.depsEliminarCuenta();
      const deps = {
        detenerSync: u => { const e = base.detenerSync(u); log.push('detenerSync'); return e; },
        esperarSyncInactiva: () => base.esperarSyncInactiva(),
        apartarSync: u => { log.push('apartar'); return win.apartarSyncCuenta(u, ls); },
        restaurarSync: (u, g) => { log.push('restaurar'); win.restaurarSyncCuenta(u, g, ls); },
        reanudarSync: () => log.push('reanudar'),
        invocar: async () => {
          log.push('invocar');
          colaDuranteInvocar = ls.getItem('telora_sync_cola:' + UID);
          vaciandoDuranteInvocar = win.eval('syncVaciando');
          // Una escritura que intente salir mientras se invoca no pasa: la sync está detenida.
          win.alGuardarEstadoSync(); await win.vaciarColaSync();
          return { ok: true, verificacion: {} };
        },
        limpiarEstadoCuenta: () => log.push('limpiarEstado'),
        cerrarSesion: async () => { log.push('cerrarSesion'); },
        borrarDatosLocales: () => log.push('borrarLocal')
      };
      const r = await win.flujoEliminarCuenta(UID, false, deps);
      const esperado = ['detenerSync', 'termina-envio-en-vuelo', 'apartar', 'invocar', 'limpiarEstado', 'cerrarSesion'];
      assert(r.ok && JSON.stringify(log) === JSON.stringify(esperado) && win.eval('syncCtx') === null
        && colaDuranteInvocar === null && vaciandoDuranteInvocar === false && envios === 0,
        'T2b (e): éxito -> detener sync, ESPERAR el envío en vuelo, apartar la cola pendiente (2 ops) y recién entonces invocar; después cerrar sesión. Durante la invocación la cola no está en el almacenamiento y nada se envía',
        JSON.stringify({ log, colaDuranteInvocar, vaciandoDuranteInvocar, envios }));

      // (f) Falla la función: la sesión se mantiene, la cola vuelve (combinada con lo nuevo) y la sync se reanuda.
      const ls2 = new AlmacenFalso({ ['telora_sync_cola:' + UID]: JSON.stringify([opA, opB]) });
      const log2 = [];
      const deps2 = { ...deps,
        detenerSync: () => { log2.push('detenerSync'); return { realtime: true, escritura: true }; },
        esperarSyncInactiva: async () => true,
        apartarSync: u => { log2.push('apartar'); return win.apartarSyncCuenta(u, ls2); },
        restaurarSync: (u, g) => { log2.push('restaurar'); win.restaurarSyncCuenta(u, g, ls2); },
        reanudarSync: (u, e) => log2.push('reanudar:' + JSON.stringify(e)),
        invocar: async () => {
          log2.push('invocar');
          ls2.setItem('telora_sync_cola:' + UID, JSON.stringify([opC]));   // otra pestaña encoló algo mientras tanto
          return { ok: false, error: 'error_borrando_usuario' };
        },
        limpiarEstadoCuenta: () => log2.push('limpiarEstado'),
        cerrarSesion: async () => { log2.push('cerrarSesion'); },
        borrarDatosLocales: () => log2.push('borrarLocal')
      };
      const r2 = await win.flujoEliminarCuenta(UID, true, deps2);
      const cola2 = JSON.parse(ls2.getItem('telora_sync_cola:' + UID) || '[]').map(o => o.clave);
      assert(!r2.ok && r2.error === 'error_borrando_usuario'
        && JSON.stringify(log2) === JSON.stringify(['detenerSync', 'apartar', 'invocar', 'restaurar', 'reanudar:{"realtime":true,"escritura":true}'])
        && JSON.stringify(cola2) === JSON.stringify(['e1', 'g1', 'i1']),
        'T2b (f): si la función falla, NO se cierra sesión ni se borra lo local; la cola apartada vuelve (combinada con lo encolado entretanto) y la sync se reanuda',
        JSON.stringify({ r2, log2, cola2 }));

      // (g) La invocación lanza (sin red): mismo camino de falla, código 'red'.
      const log3 = [];
      const r3 = await win.flujoEliminarCuenta(UID, false, { ...deps2,
        detenerSync: () => ({ realtime: false, escritura: false }),
        apartarSync: () => ({}),
        restaurarSync: () => log3.push('restaurar'),
        reanudarSync: () => log3.push('reanudar'),
        invocar: async () => { throw new TypeError('Failed to fetch'); },
        cerrarSesion: async () => log3.push('cerrarSesion')
      });
      assert(!r3.ok && r3.error === 'red' && JSON.stringify(log3) === JSON.stringify(['restaurar', 'reanudar']),
        'T2b (g): si la invocación lanza (sin red), se restaura y reanuda la sync y la sesión sigue abierta',
        JSON.stringify({ r3, log3 }));
    }finally{
      win.eval('syncCtx = null; syncVaciando = false;');
      win.leerDuenoConfirmado = origE.leerDuenoConfirmado;
      win.esPestanaLiderSync = origE.esPestanaLiderSync;
      win.eval('syncTransporte').upsert = origE.upsert;
    }

    // ---- (h) Otro dispositivo: un 23503 al subir -> detener, cerrar sesión, avisar UNA vez, sin bucle ----
    const alm = win.eval('syncAlmacen'), tr = win.eval('syncTransporte');
    const origH = {
      leerDuenoConfirmado: win.leerDuenoConfirmado, esPestanaLiderSync: win.esPestanaLiderSync,
      limpiarEstadoSyncCuenta: win.limpiarEstadoSyncCuenta, renderCuentaUsuario: win.renderCuentaUsuario, showToast: win.showToast,
      upsert: tr.upsert, leerCola: alm.leerCola, guardarCola: alm.guardarCola, leerFallidas: alm.leerFallidas, guardarFallidas: alm.guardarFallidas
    };
    win.__t2bSupaOrig = win.eval('supa');
    try{
      let cola = [opA], fallidas = [], envios = 0, signOuts = 0, limpiezas = [];
      const toasts = [];
      alm.leerCola = () => cola.slice(); alm.guardarCola = (u, c) => { cola = c; return true; };
      alm.leerFallidas = () => fallidas.slice(); alm.guardarFallidas = (u, f) => { fallidas = f; return true; };
      tr.upsert = async () => { envios++; return { error: err23503, status: 409 }; };
      win.leerDuenoConfirmado = () => UID;
      win.esPestanaLiderSync = () => true;
      win.limpiarEstadoSyncCuenta = u => { limpiezas.push(u); return []; };
      win.renderCuentaUsuario = () => {};
      win.showToast = msg => toasts.push(msg);
      win.__t2bSupaStub = {
        auth: {
          getSession: async () => ({ data: { session: { user: { id: UID } } } }),
          signOut: async () => { signOuts++; return { error: null }; },
          getUser: async () => ({ data: { user: null }, error: { code: 'user_not_found', status: 403, message: 'User from sub claim in JWT does not exist' } })
        },
        removeChannel(){}
      };
      win.eval('supa = window.__t2bSupaStub; cuentaEliminadaAvisada = false; syncCtx = { userId: "' + UID + '", deviceId: "dev-t2b", esEscritor: true };');
      await win.vaciarColaSync();
      await tick(30);
      const primera = { envios, signOuts, toasts: toasts.slice(), fallidas: fallidas.length, syncCtx: win.eval('syncCtx'), reintento: win.eval('syncTimerReintento'), limpiezas: limpiezas.slice() };
      // Segunda vuelta (p. ej. otra pestaña vuelve a activar la sync): nuevo 23503, sin repetir aviso ni cierre.
      win.eval('syncCtx = { userId: "' + UID + '", deviceId: "dev-t2b", esEscritor: true };');
      await win.vaciarColaSync();
      await tick(30);
      assert(primera.envios === 1 && primera.signOuts === 1 && primera.toasts.join() === 'Tu cuenta de Telora fue eliminada. Tus datos siguen en este dispositivo.'
        && primera.fallidas === 0 && primera.syncCtx === null && primera.reintento === null && primera.limpiezas.join() === UID,
        'T2b (h): stub que devuelve 23503 (FK de user_id) -> se detiene la sync (sin reintento ni fallidas), se limpia el estado de la cuenta, se cierra la sesión y se avisa «Tu cuenta de Telora fue eliminada…»',
        JSON.stringify(primera));
      assert(envios === 2 && signOuts === 1 && toasts.length === 1,
        'T2b (h): un segundo 23503 no repite el aviso ni el cierre de sesión (una sola vez, sin bucle)',
        JSON.stringify({ envios, signOuts, toasts: toasts.length }));

      // (i) Cierre de sesión inesperado (refresco rechazado / otra pestaña): user_not_found -> mismo manejo; usuario vivo -> nada.
      toasts.length = 0; signOuts = 0;
      win.eval('cuentaEliminadaAvisada = false;');
      await win.verificarCuentaTrasCierreInesperado({ userId: UID, token: 'token-prueba' });
      await tick(30);
      const eliminado = { toasts: toasts.slice(), signOuts };
      win.eval('cuentaEliminadaAvisada = false;');
      win.__t2bSupaStub.auth.getUser = async () => ({ data: { user: { id: UID } }, error: null });
      toasts.length = 0;
      await win.verificarCuentaTrasCierreInesperado({ userId: UID, token: 'token-prueba' });
      await tick(30);
      assert(eliminado.toasts.length === 1 && eliminado.signOuts === 1 && toasts.length === 0,
        'T2b (i): sesión cerrada sin pedirla -> si auth responde user_not_found se avisa que la cuenta fue eliminada; si el usuario existe, no se muestra nada',
        JSON.stringify({ eliminado, usuarioVivo: toasts.length }));
    }finally{
      win.eval('supa = window.__t2bSupaOrig; cuentaEliminadaAvisada = false; syncCtx = null;');
      delete win.__t2bSupaOrig; delete win.__t2bSupaStub;
      Object.assign(alm, { leerCola: origH.leerCola, guardarCola: origH.guardarCola, leerFallidas: origH.leerFallidas, guardarFallidas: origH.guardarFallidas });
      tr.upsert = origH.upsert;
      win.leerDuenoConfirmado = origH.leerDuenoConfirmado; win.esPestanaLiderSync = origH.esPestanaLiderSync;
      win.limpiarEstadoSyncCuenta = origH.limpiarEstadoSyncCuenta; win.renderCuentaUsuario = origH.renderCuentaUsuario; win.showToast = origH.showToast;
    }

    // ---- (j) Otra pestaña borró los datos locales -> esta se recarga; cualquier otro cambio -> nada ----
    // Se despachan StorageEvent sintéticos sobre la ventana del iframe (no se toca localStorage)
    // y recargarPorBorradoLocal se reemplaza por un contador.
    {
      const origJ = win.recargarPorBorradoLocal;
      let recargas = 0;
      win.recargarPorBorradoLocal = () => { recargas++; };
      const evento = (key, oldValue, newValue) => {
        const antes = recargas;
        win.dispatchEvent(new win.StorageEvent('storage', { key, oldValue, newValue }));
        return recargas - antes;
      };
      try{
        const r = {
          borrado: evento('misfinanzas_data', '{"expenses":[]}', null),
          restauracion: evento('misfinanzas_data', '{"expenses":[]}', '{"expenses":[{"id":"x"}]}'),
          primeraEscritura: evento('misfinanzas_data', null, '{"expenses":[]}'),
          otraClave: evento('misfinanzas_build', 'abc', null)
        };
        assert(r.borrado === 1 && r.restauracion === 0 && r.primeraEscritura === 0 && r.otraClave === 0,
          'T2b (j): evento storage con misfinanzas_data -> null (borrado en otra pestaña) recarga; con otro valor, al crearla o con otra clave, nada',
          JSON.stringify(r));
      }finally{
        win.recargarPorBorradoLocal = origJ;
      }
    }
  }

  // ==================== T2b — Edge Function: lógica pura de index.ts ====================
  // Se lee el index.ts REAL (mismo origen, archivo local), se extrae el bloque // <puro> …
  // // </puro>, se quitan las anotaciones «nombre: tipo» de los parámetros y se evalúa aquí.
  {
    let puro = null, detalleCarga = '';
    try{
      const txt = await (await fetch('supabase/functions/eliminar-cuenta/index.ts', { cache: 'no-store' })).text();
      const m = txt.match(/\/\/ <puro>[\s\S]*?\n\/\/ <\/puro>/);
      if(!m) throw new Error('no se encontró el bloque <puro>');
      const js = m[0].replace(/(\w)\s*:\s*(?:any|number|string|boolean)(?=\s*[,)])/g, '$1');
      puro = new Function(js + '\nreturn { elegirClaveSecreta, claimsDeUsuarioValidos };')();
    }catch(e){ detalleCarga = e.message; }
    assert(!!puro && typeof puro.elegirClaveSecreta === 'function' && typeof puro.claimsDeUsuarioValidos === 'function',
      'T2b (k): el bloque «puro» de supabase/functions/eliminar-cuenta/index.ts se extrae y evalúa', detalleCarga);
    if(puro){
      const f = puro.elegirClaveSecreta;
      const r = {
        conDefault:   f('{"default":"sb_secret_A","otra":"sb_secret_B"}', 'LEGACY'),
        sinDefault:   f('{"telora":"sb_secret_B","x":"sb_secret_C"}', 'LEGACY'),
        defaultVacio: f('{"default":"","x":"sb_secret_C"}', ''),
        vacio:        f('', 'LEGACY'),
        objetoVacio:  f('{}', 'LEGACY'),
        invalido:     f('{no es json', 'LEGACY'),
        arreglo:      f('["sb_secret_Z"]', 'LEGACY'),
        nada:         f('', '')
      };
      const ok =
        r.conDefault.clave === 'sb_secret_A' && r.conDefault.fuente === 'default' &&
        r.sinDefault.clave === 'sb_secret_B' && r.sinDefault.fuente === 'primera' &&
        r.defaultVacio.clave === 'sb_secret_C' &&
        r.vacio.clave === 'LEGACY' && r.vacio.fuente === 'legacy' && !r.vacio.invalido &&
        r.objetoVacio.clave === 'LEGACY' &&
        r.invalido.clave === 'LEGACY' && r.invalido.invalido === true &&
        r.arreglo.clave === 'LEGACY' &&
        r.nada.clave === '' && r.nada.fuente === 'ninguna';
      assert(ok, 'T2b (k): elegirClaveSecreta — con "default", sin "default" (la primera), vacío, JSON inválido (respaldo legacy + aviso) y sin ninguna (-> configuracion_incompleta)',
        JSON.stringify(r));
      const v = puro.claimsDeUsuarioValidos, ahora = 1790000000;
      const c = { sub: 'uid-x', role: 'authenticated', exp: ahora + 60 };
      const rc = {
        valido: v(c, ahora), anon: v({ ...c, role: 'anon' }, ahora), serviceRole: v({ ...c, role: 'service_role' }, ahora),
        vencido: v({ ...c, exp: ahora }, ahora), sinSub: v({ ...c, sub: '' }, ahora), expTexto: v({ ...c, exp: String(ahora + 60) }, ahora), nulo: v(null, ahora)
      };
      assert(rc.valido && !rc.anon && !rc.serviceRole && !rc.vencido && !rc.sinSub && !rc.expTexto && !rc.nulo,
        'T2b (k): claimsDeUsuarioValidos exige sub, role = authenticated y exp vigente', JSON.stringify(rc));
    }
  }

  // ==================== T20 · E0 + E1 — Escritorio: tokens, menú lateral y barra superior ====================
  // El iframe está oculto (display:none, sin viewport propio). Para las pruebas de escritorio
  // se muestra FUERA de pantalla con un ancho fijo y al final vuelve a display:none. El evento
  // `change` de matchMedia solo se despacha cuando la página pinta un cuadro (y esta pestaña
  // puede estar en segundo plano), así que tras cada cambio de ancho se llama a
  // syncDeskLayout() a mano: es exactamente lo que hace ese manejador.
  {
    const d = win.document;
    const css = (sel, prop) => win.getComputedStyle(typeof sel === 'string' ? d.querySelector(sel) : sel).getPropertyValue(prop);
    const anchoIframe = w => { iframe.style.cssText = `position:absolute; left:-10000px; top:0; width:${w}px; height:900px; border:0;`; void win.innerWidth; win.syncDeskLayout(); };
    const abiertos = () => [...d.querySelectorAll('.sheet-overlay.open')].map(o => o.id).filter(id => id !== 'sheetOnboarding');
    const cerrarSheets = () => abiertos().forEach(id => win.closeSheet(id));
    const activos = sel => [...d.querySelectorAll(sel)].filter(b => b.classList.contains('active') && b.getAttribute('aria-current') === 'page').map(b => b.dataset.screen);
    const ordenOriginal = () => {
      const m = d.querySelector('.month-select'), a = d.getElementById('accountSelect');
      return m.parentNode.id === 'app' && m.previousElementSibling.id === 'updateBanner' && m.nextElementSibling === a && a.nextElementSibling.id === 'screen-resumen';
    };
    const tecla = key => d.activeElement.dispatchEvent(new win.KeyboardEvent('keydown', { key, bubbles: true, cancelable: true }));
    try{
      // (a) Tokens E0: existen con el valor que antes estaba fijo y todavía NO están en PALETAS.
      const tok = { '--on-burgundy':'#FBEFE9', '--on-burgundy-dim':'#E7C3CB', '--on-danger':'#fff', '--scrim':'rgba(10,6,5,0.6)',
                    '--focus-ring':'rgba(201,166,107,0.12)', '--mv-cuota':'#CE7C3A', '--mv-aporte':'#D9B24C' };
      const obt = Object.fromEntries(Object.keys(tok).map(k => [k, css(d.documentElement, k).trim()]));
      const enPaletas = Object.values(win.eval('PALETAS')).some(p => ['--on-burgundy','--on-burgundy-dim','--on-danger','--scrim','--focus-ring'].some(k => k in p.vars));
      assert(Object.keys(tok).every(k => obt[k] === tok[k]) && !enPaletas,
        'T20 E0 (a): los tokens nuevos existen en :root con el valor que antes estaba fijo (y aún no están en PALETAS)', JSON.stringify(obt));
      const usos = { btnPrimary: css('.btn-primary', 'color'), overlay: css('#sheetGasto', 'background-color'), balanceLabel: css('.balance-card .label', 'color') };
      assert(usos.btnPrimary === 'rgb(251, 239, 233)' && usos.overlay === 'rgba(10, 6, 5, 0.6)' && usos.balanceLabel === 'rgb(231, 195, 203)',
        'T20 E0 (b): los usos reemplazados resuelven al mismo color de antes', JSON.stringify(usos));

      // Fixture: 2 cuentas (para que exista «Transferencia») y ninguna meta.
      const st = fixtureBase();
      st.accounts.push({ id:'acc2', nombre:'Ahorro', orden:1, archivada:false });
      setState(win, st);
      resetCaches(win);
      win.renderAll();

      // (c) 1440 px: menú lateral visible, barra inferior oculta, selectores reutilizados en la barra superior.
      anchoIframe(1440);
      const topbar = d.querySelector('.topbar'), mesSel = d.querySelector('.month-select'), ctaSel = d.getElementById('accountSelect');
      const rC = { mq: win.matchMedia('(min-width: 1024px)').matches, nav: css('#deskNav', 'display'), bottom: css('.bottom-zone', 'display'),
                   enBarra: mesSel.parentNode === topbar && mesSel.nextElementSibling === ctaSel && ctaSel.nextElementSibling === topbar.querySelector('.top-actions'),
                   idsUnicos: d.querySelectorAll('#prevMonth, #nextMonth, #monthLabel, #accountSelect, #btnResumenImg, #btnExport').length };
      assert(rC.mq && rC.nav === 'flex' && rC.bottom === 'none' && rC.enBarra && rC.idsUnicos === 6,
        'T20 E1 (c): a 1440 px hay menú lateral, la barra inferior se oculta y el selector de mes/cuenta (mismos nodos, ids únicos) va en la barra superior', JSON.stringify(rC));

      // (d) Misma pantalla activa en ambos sentidos (clase + aria-current) y título de la barra superior.
      d.querySelector('.desk-nav-item[data-screen="cuotas"]').click();
      const r1 = { lateral: activos('.desk-nav-item[data-screen]'), inferior: activos('.nav-btn'), pantalla: d.querySelector('.screen.active').id, titulo: d.getElementById('deskTitle').textContent };
      assert(JSON.stringify(r1) === JSON.stringify({ lateral:['cuotas'], inferior:['cuotas'], pantalla:'screen-cuotas', titulo:'Cuotas' }),
        'T20 E1 (d1): «Cuotas» en el menú lateral → la barra inferior marca la misma pantalla', JSON.stringify(r1));
      d.querySelector('.nav-btn[data-screen="metas"]').click();
      const r2 = { lateral: activos('.desk-nav-item[data-screen]'), inferior: activos('.nav-btn'), pantalla: d.querySelector('.screen.active').id, titulo: d.getElementById('deskTitle').textContent };
      assert(JSON.stringify(r2) === JSON.stringify({ lateral:['metas'], inferior:['metas'], pantalla:'screen-metas', titulo:'Metas' }),
        'T20 E1 (d2): «Metas» en la barra inferior → el menú lateral marca la misma pantalla', JSON.stringify(r2));

        && tras.paso1Oculto && tras.paso2 && tras.destino === 'ana@ejemplo.cl' && tras.foco && tras.reenviarDis && tras.reenviar === 'Reenviar código en 60 s',
        'T21 L1 (g): paso 1 bajo «Continuar con Google» y su «o» (texto legal debajo); correo inválido → error con role=alert y foco; válido → signInWithOtp(shouldCreateUser:true, sin emailRedirectTo), paso 2 con foco en el código y reenvío en 60 s',
        JSON.stringify({ estructura, invalido, envio, tras }));

      // (h) Paso 2: campo, error mapeado, pegado con autoverificación y reenvío al terminar la cuenta regresiva.
      const campo = { im: inpK.getAttribute('inputmode'), ac: inpK.getAttribute('autocomplete'), max: inpK.maxLength, fuente: win.getComputedStyle(inpK).fontSize,
                      alerta: $('loginCorreoError2').getAttribute('role') };
      respVerif = { data: { user: null, session: null }, error: apiErr({ name:'AuthApiError', status:403, code:'otp_expired', message:'Token has expired or is invalid' }) };
      const dt = new win.DataTransfer(); dt.setData('text', '123 456');
      inpK.dispatchEvent(new win.ClipboardEvent('paste', { clipboardData: dt, bubbles: true, cancelable: true }));
      await tick(10);
      const verif = llamadas[1] && llamadas[1][1];
      const errorIncorrecto = err2(), focoTrasError = d.activeElement === inpK;
      inpK.dispatchEvent(new win.Event('input')); await tick(10);
      const sinRepetir = llamadas.length;
      respVerif = { data: { user: null, session: null }, error: apiErr({ name:'AuthApiError', status:429, code:'over_request_rate_limit', message:'For security purposes, you can only request this after 7 seconds.' }) };
      inpK.value = '65432'; $('btnLoginVerificar').click(); await tick(10);
      const incompleto = { error: err2(), llamadas: llamadas.length };
      inpK.value = '654321'; inpK.dispatchEvent(new win.Event('input')); await tick(10);
      const limite = { error: err2(), boton: $('btnLoginVerificar').textContent, dis: $('btnLoginVerificar').disabled };
      win.eval('loginCorreo.bloqueoVerifHastaMs = 0; loginCorreo.enviadoMs -= 61000;'); win.pintarLoginCorreo();
      const reenvioListo = { texto: $('btnLoginReenviar').textContent, dis: $('btnLoginReenviar').disabled };
      $('btnLoginReenviar').click(); await tick(10);
      const reenvio = { llamada: llamadas[llamadas.length - 1], aviso: $('loginCorreoAviso').textContent, aviso_rol: $('loginCorreoAviso').getAttribute('role'),
                        texto: $('btnLoginReenviar').textContent, codigoLimpio: inpK.value === '', foco: d.activeElement === inpK };
      assert(campo.im === 'numeric' && campo.ac === 'one-time-code' && campo.max === 6 && campo.fuente === '16px' && campo.alerta === 'alert'
        && verif && verif.token === '123456' && verif.type === 'email' && verif.email === 'ana@ejemplo.cl'
        && errorIncorrecto === 'El código no es correcto. Revísalo e inténtalo de nuevo.' && focoTrasError && sinRepetir === 2
        && incompleto.error === 'Escribe los 6 dígitos del código.' && incompleto.llamadas === 2
        && /7 segundos/.test(limite.error) && limite.dis && /^Espera \d s$/.test(limite.boton)
        && reenvioListo.texto === 'Reenviar código' && !reenvioListo.dis
        && reenvio.llamada[0] === 'otp' && reenvio.llamada[1].email === 'ana@ejemplo.cl' && reenvio.aviso === 'Te enviamos un código nuevo.' && reenvio.aviso_rol === 'status'
        && reenvio.texto === 'Reenviar código en 60 s' && reenvio.codigoLimpio && reenvio.foco,
        'T21 L1 (h): paso 2 (numeric, one-time-code, 6, 16 px); pegar «123 456» verifica solo con type email; incorrecto y límite del servidor con su espera; el mismo código no se reintenta; reenviar tras 60 s',
        JSON.stringify({ campo, verif, errorIncorrecto, focoTrasError, sinRepetir, incompleto, limite, reenvioListo, reenvio }));

      // (i) Sin conexión: botones deshabilitados con texto; Cambiar correo vuelve al paso 1 con el correo.
      Object.defineProperty(win.navigator, 'onLine', { configurable: true, get: () => false });
      win.dispatchEvent(new win.Event('offline'));
      const offline = { entrar: $('btnLoginVerificar').textContent, entrarDis: $('btnLoginVerificar').disabled, reenviarDis: $('btnLoginReenviar').disabled };
      delete win.navigator.onLine;
      win.dispatchEvent(new win.Event('online'));
      const online = { entrar: $('btnLoginVerificar').textContent, entrarDis: $('btnLoginVerificar').disabled };
      $('btnLoginCambiarCorreo').click();
      const cambiar = { paso1: visible('loginCorreoPaso1'), paso2Oculto: $('loginCorreoPaso2').hidden, correo: inpC.value.trim(), foco: d.activeElement === inpC };
      Object.defineProperty(win.navigator, 'onLine', { configurable: true, get: () => false });
      win.dispatchEvent(new win.Event('offline'));
      const offline1 = { texto: $('btnLoginEnviarCodigo').textContent, dis: $('btnLoginEnviarCodigo').disabled };
      delete win.navigator.onLine;
      win.dispatchEvent(new win.Event('online'));
      respEnvio = { data: { user: null, session: null }, error: apiErr({ name:'AuthApiError', status:429, code:'over_email_send_rate_limit', message:'For security purposes, you can only request this after 42 seconds.' }) };
      $('btnLoginEnviarCodigo').click(); await tick(10);
      const limiteEnvio = { error: err1(), boton: $('btnLoginEnviarCodigo').textContent, dis: $('btnLoginEnviarCodigo').disabled, paso1: visible('loginCorreoPaso1') };
      assert(offline.entrar === 'Necesitas conexión para entrar' && offline.entrarDis && offline.reenviarDis && online.entrar === 'Entrar' && !online.entrarDis
        && cambiar.paso1 && cambiar.paso2Oculto && cambiar.correo === 'ana@ejemplo.cl' && cambiar.foco
        && offline1.texto === 'Necesitas conexión para enviar el código' && offline1.dis
        && /42 segundos/.test(limiteEnvio.error) && /^Espera 4\d s$/.test(limiteEnvio.boton) && limiteEnvio.dis && limiteEnvio.paso1,
        'T21 L1 (i): sin conexión los botones se deshabilitan con texto; «Cambiar correo» vuelve al paso 1 con el correo y el foco; límite de envío del servidor con cuenta regresiva',
        JSON.stringify({ offline, online, cambiar, offline1, limiteEnvio }));

      // (j) Éxito: la sesión por correo pasa por el MISMO onAuthStateChange que la de Google.
      win.eval('loginCorreo.bloqueoEnvioHastaMs = 0;');
      respEnvio = { data: { user: null, session: null }, error: null }; respVerif = null;
      win.pintarLoginCorreo();
      $('btnLoginEnviarCodigo').click(); await tick(10);
      eventos.length = 0;
      inpK.value = '111222'; inpK.dispatchEvent(new win.Event('input')); await tick(20);
      const porCorreo = eventos.splice(0).map(e => e[0]);
      const estadoCorreo = { con: visible('cuentaUsuarioConSesion'), email: $('cuentaUsuarioEmail').textContent, eliminar: visible('btnEliminarCuenta'),
        sesionConocida: win.eval('sesionConocida && sesionConocida.userId'), foco: d.activeElement === $('cuentaUsuarioSesionTxt'),
        formReiniciado: !$('loginCorreoPaso1').hidden && $('loginCorreoPaso2').hidden && inpK.value === '' };
      win.eval('cierreSesionPropio = true;'); await auth._notifyAllSubscribers('SIGNED_OUT', null, false); win.eval('cierreSesionPropio = false;');
      eventos.length = 0;
      // Lo que llega al volver de Google: la librería emite SIGNED_IN por el mismo canal.
      await auth._notifyAllSubscribers('SIGNED_IN', sesionDe('ana@gmail.com', { full_name: 'Ana Pérez' }), false);
      const porGoogle = eventos.splice(0).map(e => e[0]);
      const estadoGoogle = { con: visible('cuentaUsuarioConSesion'), email: $('cuentaUsuarioEmail').textContent, eliminar: visible('btnEliminarCuenta'),
        sesionConocida: win.eval('sesionConocida && sesionConocida.userId') };
      assert(porCorreo.join() === 'render,subida' && porCorreo.join() === porGoogle.join()
        && estadoCorreo.con && estadoCorreo.email === 'ana@ejemplo.cl' && estadoCorreo.eliminar && estadoCorreo.sesionConocida === 'uid-ana@ejemplo.cl'
        && estadoCorreo.foco && estadoCorreo.formReiniciado
        && estadoGoogle.con && estadoGoogle.email === 'ana@gmail.com' && estadoGoogle.eliminar && estadoGoogle.sesionConocida === 'uid-ana@gmail.com',
        'T21 L1 (j): al entrar con el código, verifyOtp → onAuthStateChange → renderCuentaUsuario + intentarSubidaInicial, igual que con Google; queda «Eliminar mi cuenta» y el foco pasa a «Sesión iniciada como…»',
        JSON.stringify({ porCorreo, porGoogle, estadoCorreo, estadoGoogle }));

      // (k) 1440 px: el bloque cabe sin desbordar y el paso 2 también a 375 px.
      win.eval('cierreSesionPropio = true;'); await auth._notifyAllSubscribers('SIGNED_OUT', null, false); win.eval('cierreSesionPropio = false;');
      const desborde = () => { const g = sinSesion.closest('.cfg-group-body'); return [...g.querySelectorAll('*')].filter(n => n.offsetParent !== null && n.getBoundingClientRect().right > g.getBoundingClientRect().right + 0.5).map(n => n.id || n.className || n.tagName); };
      const a375p1 = desborde();
      inpC.value = 'ana@ejemplo.cl'; $('btnLoginEnviarCodigo').click(); await tick(10);
      const a375p2 = desborde();
      anchoIframe(1440);
      const a1440p2 = desborde(), nav = win.getComputedStyle($('deskNav')).display;
      assert(a375p1.length === 0 && a375p2.length === 0 && a1440p2.length === 0 && nav !== 'none',
        'T21 L1 (k): pasos 1 y 2 sin desbordes a 375 px y a 1440 px (con el menú lateral)', JSON.stringify({ a375p1, a375p2, a1440p2, nav }));
    }catch(e){
      assert(false, 'T21 L1: excepción durante las pruebas de login por correo', e && e.stack || String(e));
    }finally{
      try{ delete win.navigator.onLine; }catch(_){}
      Object.assign(auth, origAuth);
      win.intentarSubidaInicial = origSubida; win.renderCuentaUsuario = origRender;
      try{
        if(win.eval('sesionConocida')){ win.eval('cierreSesionPropio = true;'); await auth._notifyAllSubscribers('SIGNED_OUT', null, false); win.eval('cierreSesionPropio = false;'); }
        win.eval('loginCorreo.bloqueoEnvioHastaMs = 0; loginCorreo.bloqueoVerifHastaMs = 0;');
        win.reiniciarLoginCorreo(); win.renderCuentaUsuario(null);
        [...d.querySelectorAll('.sheet-overlay.open')].map(o => o.id).filter(id => id !== 'sheetOnboarding').forEach(id => win.closeSheet(id));
      }catch(_){}
      iframe.style.cssText = 'display:none';
      try{ win.syncDeskLayout(); }catch(_){}
    }
  }

  renderResultados();
  checkLocalStorage();
}

// Verifica que abrir este harness no haya escrito nada en el localStorage real de este
// origen (loadState() SOLO lee; saveState()/saveStateQuiet() nunca se llaman desde acá).
function checkLocalStorage(){
  const div = document.getElementById('localStorageCheck');
  try{
    const antes = window.__lsSnapshotAntes;
    const ahora = JSON.stringify(Object.keys(localStorage).sort());
    div.textContent = (ahora === antes)
      ? '✅ localStorage del origen (ventana padre) sin cambios tras correr los tests.'
      : `⚠️ localStorage del origen cambió. Antes: ${antes} — Ahora: ${ahora}`;
  }catch(e){
    div.textContent = 'No se pudo verificar localStorage: ' + e.message;
  }
}

try{ window.__lsSnapshotAntes = JSON.stringify(Object.keys(localStorage).sort()); }catch(e){ window.__lsSnapshotAntes = null; }

document.getElementById('appFrame').addEventListener('load', ()=>{
  // Pequeño margen: aunque el script del iframe corre de forma síncrona durante el parseo
  // (no hay guard DOMContentLoaded en index.html), se espera un tick extra por si algo
  // async del iframe (fonts, etc.) dispara antes del evento load.
  setTimeout(runTests, 50);
});
